name: Dispatch corrected Aspire v4 matrix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_temporary-dispatch-aspire-v4-20261125.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch current main workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/zerodaybugs/runner-cleanroom-20261114-7f3c9a/actions/workflows/_temporary-aspire-cve120006-macos-matrix-v4-20261125.yml/dispatches \
            -d '{"ref":"main"}'
