name: Sealed macOS VSTest E2E validation

on:
  push:
    branches:
      - research/vstest-macos-sealed-20261116
    paths:
      - '.github/workflows/sealed-macos-validation.yml'
      - 'scripts/run-sealed-payload.ps1'
      - 'scripts/seal-evidence.ps1'
      - 'vstest-macos-e2e-v4.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        sdk: ['10.0.404', '11.0.100']
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.sdk }}

      - name: Run sealed E2E validation
        shell: pwsh
        env:
          WRAPPING_KEY_B64: ${{ secrets.PAYLOAD_KEY_B64 }}
          SDK_VERSION: ${{ matrix.sdk }}
        run: |
          $payload = Join-Path $PWD 'vstest-macos-e2e-v4.payload.sh'
          ./scripts/run-sealed-payload.ps1 -PayloadPrefix 'vstest-macos-e2e-v4' -OutputPath $payload
          & /bin/chmod 0700 $payload
          & /bin/bash $payload
          if ($LASTEXITCODE -ne 0) { throw "sealed E2E v4 validation failed: $LASTEXITCODE" }

      - name: Seal private evidence
        if: always()
        shell: pwsh
        run: |
          ./scripts/seal-evidence.ps1 `
            -PayloadPrefix 'vstest-macos-e2e-v4' `
            -EvidenceFilter 'evidence-vstest-macos-e2e-v4-*' `
            -OutputDirectory (Join-Path $PWD 'sealed-evidence') `
            -Metadata 'SDK=${{ matrix.sdk }};RUN_ID=${{ github.run_id }};SOURCE_SHA=${{ github.sha }}'
          Remove-Item -LiteralPath (Join-Path $PWD 'vstest-macos-e2e-v4.payload.sh') -Force -ErrorAction SilentlyContinue
          Write-Host "SEALED_E2E_V4_EVIDENCE=PASS SDK=${{ matrix.sdk }}"

      - name: Upload sealed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vstest-macos-e2e-sealed-v4-${{ matrix.sdk }}
          path: sealed-evidence
          if-no-files-found: error
          retention-days: 3
