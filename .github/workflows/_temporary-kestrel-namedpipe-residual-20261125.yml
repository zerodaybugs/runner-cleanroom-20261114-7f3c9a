name: Sealed Kestrel Named Pipes recovery residual matrix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_temporary-kestrel-namedpipe-residual-20261125.yml'
      - 'sealed/kestrel-namedpipe-residual-v1/**'

permissions:
  contents: read

jobs:
  exact-ga-windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        lane:
          - name: net10
            sdk: 10.0.404
            tfm: net10.0
            runtime: 10.0.15
          - name: net11
            sdk: 11.0.100
            tfm: net11.0
            runtime: 11.0.0
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout sealed inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install exact SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: ${{ matrix.lane.sdk }}
          cache: false

      - name: Unseal and execute isolated ownership validation
        id: execute
        continue-on-error: true
        shell: pwsh
        env:
          WRAPPING_KEY_B64: ${{ secrets.PAYLOAD_KEY_B64 }}
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
          DOTNET_MULTILEVEL_LOOKUP: '0'
          DOTNET_ROLL_FORWARD: LatestPatch
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:WRAPPING_KEY_B64)) { throw 'wrapping key missing' }

          $wrappingKey = [Convert]::FromBase64String($env:WRAPPING_KEY_B64)
          if ($wrappingKey.Length -ne 32) { throw 'wrapping key length invalid' }
          $wrappedPrivate = [IO.File]::ReadAllBytes((Join-Path $PWD 'bootstrap/private.pem.enc'))
          $wrapIv = [Convert]::FromHexString((Get-Content -LiteralPath (Join-Path $PWD 'bootstrap/private.iv.hex') -Raw).Trim())
          $aes = [Security.Cryptography.Aes]::Create()
          try {
            $aes.Mode = [Security.Cryptography.CipherMode]::CBC
            $aes.Padding = [Security.Cryptography.PaddingMode]::PKCS7
            $aes.Key = $wrappingKey
            $aes.IV = $wrapIv
            $decryptor = $aes.CreateDecryptor()
            try { $privatePemBytes = $decryptor.TransformFinalBlock($wrappedPrivate, 0, $wrappedPrivate.Length) }
            finally { $decryptor.Dispose() }
          } finally { $aes.Dispose() }

          $sealedRoot = Join-Path $PWD 'sealed/kestrel-namedpipe-residual-v1'
          $rsa = [Security.Cryptography.RSA]::Create()
          try {
            $rsa.ImportFromPem([Text.Encoding]::ASCII.GetString($privatePemBytes))
            $wrappedPayloadKey = [Convert]::FromBase64String((Get-Content -LiteralPath (Join-Path $sealedRoot 'payload.key.enc.b64') -Raw).Trim())
            $payloadKey = $rsa.Decrypt($wrappedPayloadKey, [Security.Cryptography.RSAEncryptionPadding]::OaepSHA256)
          } finally { $rsa.Dispose() }
          if ($payloadKey.Length -ne 32) { throw 'payload key length invalid' }
          [IO.File]::WriteAllBytes((Join-Path $PWD 'namedpipe.runtime.key'), $payloadKey)

          $payloadIv = [Convert]::FromHexString((Get-Content -LiteralPath (Join-Path $sealedRoot 'payload.iv.hex') -Raw).Trim())
          $payloadCipherB64 = ((Get-ChildItem -LiteralPath $sealedRoot -File -Filter 'payload.enc.part*' | Sort-Object Name | ForEach-Object { (Get-Content -LiteralPath $_.FullName -Raw).Trim() }) -join '')
          $payloadCipher = [Convert]::FromBase64String($payloadCipherB64)
          $aes = [Security.Cryptography.Aes]::Create()
          try {
            $aes.Mode = [Security.Cryptography.CipherMode]::CBC
            $aes.Padding = [Security.Cryptography.PaddingMode]::PKCS7
            $aes.Key = $payloadKey
            $aes.IV = $payloadIv
            $decryptor = $aes.CreateDecryptor()
            try { $payloadPlain = $decryptor.TransformFinalBlock($payloadCipher, 0, $payloadCipher.Length) }
            finally { $decryptor.Dispose() }
          } finally { $aes.Dispose() }

          $payloadZip = Join-Path $PWD 'namedpipe.payload.zip'
          [IO.File]::WriteAllBytes($payloadZip, $payloadPlain)
          $expectedHash = (Get-Content -LiteralPath (Join-Path $sealedRoot 'payload.plain.sha256') -Raw).Trim().ToLowerInvariant()
          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $payloadZip).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) { throw "payload hash mismatch: $actualHash" }

          $payloadDir = Join-Path $PWD 'namedpipe-payload'
          Expand-Archive -LiteralPath $payloadZip -DestinationPath $payloadDir -Force
          $probeRoot = Join-Path $payloadDir 'zdb-kestrel-namedpipe-residual'
          & pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $probeRoot 'run.ps1') `
            -DotnetExe (Join-Path $env:ProgramFiles 'dotnet/dotnet.exe') `
            -ProbeTfm '${{ matrix.lane.tfm }}' `
            -ExpectedRuntime '${{ matrix.lane.runtime }}' `
            -ExpectedSdk '${{ matrix.lane.sdk }}'
          if ($LASTEXITCODE -ne 0) { throw "probe failed: $LASTEXITCODE" }

      - name: Seal evidence
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $keyPath = Join-Path $PWD 'namedpipe.runtime.key'
          if (-not (Test-Path -LiteralPath $keyPath)) { throw 'evidence key unavailable' }
          $payloadKey = [IO.File]::ReadAllBytes($keyPath)
          $probeRoot = Join-Path $PWD 'namedpipe-payload/zdb-kestrel-namedpipe-residual'
          $evidenceDir = Join-Path $probeRoot 'evidence'
          if (-not (Test-Path -LiteralPath $evidenceDir)) {
            New-Item -ItemType Directory -Force -Path $evidenceDir | Out-Null
            'NO_EVIDENCE_DIRECTORY' | Set-Content (Join-Path $evidenceDir 'status.txt') -Encoding ascii
          }
          $zipPath = Join-Path $PWD 'namedpipe-evidence.plain.zip'
          Compress-Archive -Path $evidenceDir -DestinationPath $zipPath -Force
          $plainHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zipPath).Hash.ToLowerInvariant()
          $iv = [Security.Cryptography.RandomNumberGenerator]::GetBytes(16)
          $plain = [IO.File]::ReadAllBytes($zipPath)
          $aes = [Security.Cryptography.Aes]::Create()
          try {
            $aes.Mode = [Security.Cryptography.CipherMode]::CBC
            $aes.Padding = [Security.Cryptography.PaddingMode]::PKCS7
            $aes.Key = $payloadKey
            $aes.IV = $iv
            $encryptor = $aes.CreateEncryptor()
            try { $cipher = $encryptor.TransformFinalBlock($plain, 0, $plain.Length) }
            finally { $encryptor.Dispose() }
          } finally { $aes.Dispose() }
          $sealed = Join-Path $PWD 'sealed-evidence'
          New-Item -ItemType Directory -Force -Path $sealed | Out-Null
          $cipherPath = Join-Path $sealed 'evidence.enc'
          [IO.File]::WriteAllBytes($cipherPath, $cipher)
          [Convert]::ToHexString($iv).ToLowerInvariant() | Set-Content (Join-Path $sealed 'evidence.iv.hex') -Encoding ascii
          $plainHash | Set-Content (Join-Path $sealed 'evidence.plain.sha256') -Encoding ascii
          (Get-FileHash -Algorithm SHA256 -LiteralPath $cipherPath).Hash.ToLowerInvariant() | Set-Content (Join-Path $sealed 'evidence.cipher.sha256') -Encoding ascii
          @(
            'FORMAT=ZDB-AES-256-CBC-PKCS7-V1',
            'TARGET=CVE-2026-114157 current-GA Kestrel Named Pipes recovery residual',
            'OS=${{ matrix.os }}',
            'LANE=${{ matrix.lane.name }}',
            'SDK=${{ matrix.lane.sdk }}',
            'RUNTIME=${{ matrix.lane.runtime }}',
            'RUN_ID=${{ github.run_id }}',
            'SOURCE_SHA=${{ github.sha }}',
            'EXECUTE_OUTCOME=${{ steps.execute.outcome }}'
          ) | Set-Content (Join-Path $sealed 'metadata.txt') -Encoding ascii
          Remove-Item -LiteralPath $zipPath -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $keyPath -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $PWD 'namedpipe.payload.zip') -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $PWD 'namedpipe-payload') -Recurse -Force -ErrorAction SilentlyContinue

      - name: Upload sealed evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kestrel-namedpipe-residual-${{ matrix.os }}-${{ matrix.lane.name }}-${{ github.sha }}
          path: sealed-evidence
          if-no-files-found: error
          retention-days: 3

      - name: Enforce result
        if: always()
        shell: pwsh
        run: |
          if ('${{ steps.execute.outcome }}' -ne 'success') {
            throw 'The exact-GA ownership validation did not satisfy all controls.'
          }
