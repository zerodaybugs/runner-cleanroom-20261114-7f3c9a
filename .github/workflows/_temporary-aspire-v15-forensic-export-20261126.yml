name: Export sanitized Aspire v15 forensic evidence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_temporary-aspire-v15-forensic-export-20261126.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout sealed inputs and sanitizer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Decrypt and sanitize v15 evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WRAPPING_KEY_B64: ${{ secrets.PAYLOAD_KEY_B64 }}
        run: |
          set -euo pipefail
          test "$(sha256sum scripts/aspire-sanitize-evidence.py | awk '{print $1}')" = "5208a4001d2b452e96b46253753fc3c5b8f3f7d8085873451bd80c1a69790211"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/zerodaybugs/runner-cleanroom-20261114-7f3c9a/actions/artifacts/15154887699/zip -o artifact.zip
          test "$(sha256sum artifact.zip | awk '{print $1}')" = "acf001ec9ed99e88743988165131f727da0744cb83c119f00b17cad88630d468"
          mkdir artifact evidence
          unzip -q artifact.zip -d artifact
          grep -q '^RUN_ID=45896166399$' artifact/metadata.txt
          grep -q '^SOURCE_SHA=38ed025083643b253d3221ea499a83a41795ee9a$' artifact/metadata.txt

          printf '%s' "$WRAPPING_KEY_B64" | openssl base64 -d -A > wrapping.key
          test "$(wc -c < wrapping.key | tr -d ' ')" = "32"
          WRAP_KEY_HEX="$(od -An -tx1 -v wrapping.key | tr -d ' \n')"
          openssl enc -d -aes-256-cbc -K "$WRAP_KEY_HEX" \
            -iv "$(tr -d '\r\n ' < bootstrap/private.iv.hex)" \
            -in bootstrap/private.pem.enc -out private.pem
          tr -d '\r\n ' < sealed/aspire-macos-matrix-v2.key.enc.b64 | openssl base64 -d -A > payload.key.enc
          openssl pkeyutl -decrypt -inkey private.pem -in payload.key.enc -out runtime.key \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256
          test "$(wc -c < runtime.key | tr -d ' ')" = "32"

          test "$(sha256sum artifact/evidence.enc | awk '{print $1}')" = "$(tr -d '\r\n ' < artifact/evidence.cipher.sha256)"
          KEY_HEX="$(od -An -tx1 -v runtime.key | tr -d ' \n')"
          openssl enc -d -aes-256-cbc -K "$KEY_HEX" \
            -iv "$(tr -d '\r\n ' < artifact/evidence.iv.hex)" \
            -in artifact/evidence.enc -out evidence.zip
          test "$(sha256sum evidence.zip | awk '{print $1}')" = "$(tr -d '\r\n ' < artifact/evidence.plain.sha256)"
          unzip -q evidence.zip -d evidence
          ROOT="$(find evidence -mindepth 1 -maxdepth 1 -type d | head -1)"
          test -n "$ROOT"
          python3 scripts/aspire-sanitize-evidence.py "$ROOT" safe-forensics
          cp artifact/metadata.txt safe-forensics/ci-artifact-metadata.txt
          printf '%s  ci-artifact-metadata.txt\n' "$(sha256sum safe-forensics/ci-artifact-metadata.txt | awk '{print $1}')" >> safe-forensics/SHA256SUMS.txt
          rm -rf artifact evidence artifact.zip evidence.zip wrapping.key private.pem payload.key.enc runtime.key

      - name: Upload sanitized v15 forensic evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aspire-v15-sanitized-forensic-evidence
          path: safe-forensics
          if-no-files-found: error
          retention-days: 3
          compression-level: 6
