name: Validate Aspire v21 parallel lane patcher
# trigger: in-reconstruction-partition-r3

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/_temporary-aspire-v21-parallel-static-gate-20261128.yml'
      - 'scripts/aspire-v21-lane-selector.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout sealed inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Reconstruct v20 and validate every partition
        shell: bash
        env:
          WRAPPING_KEY_B64: ${{ secrets.PAYLOAD_KEY_B64 }}
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/aspire-v21-lane-selector.py)" = "3b5656eb514011218127d38870e98ba95a70e446"
          python3 -m py_compile scripts/aspire-v21-lane-selector.py

          cp scripts/aspire-v20-patch-chain-gate.sh /tmp/aspire-v20-reconstruct-v21.sh
          python3 - /tmp/aspire-v20-reconstruct-v21.sh <<'PY_INSERT_V21'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text()
          old = "echo V20_PATCH_CHAIN_GATE=PASS\n"
          new = r'''V21_STATIC_DIR="$GITHUB_WORKSPACE/v21-static"
mkdir -p "$V21_STATIC_DIR"
for lane in first_patched current_net10_revert current_net11 natural_fix; do
  cp "$RUN" "$V21_STATIC_DIR/run-$lane.sh"
  python3 "$GITHUB_WORKSPACE/scripts/aspire-v21-lane-selector.py" \
    "$V21_STATIC_DIR/run-$lane.sh" \
    "$lane" \
    "$V21_STATIC_DIR/receipt-$lane.json"
  bash -n "$V21_STATIC_DIR/run-$lane.sh"
  python3 -m json.tool "$V21_STATIC_DIR/receipt-$lane.json" >/dev/null
  grep -Fq 'DEV_CERT_KEYCHAIN' "$V21_STATIC_DIR/run-$lane.sh"
  grep -Fq 'security add-trusted-cert' "$V21_STATIC_DIR/run-$lane.sh"
  grep -Fq '# V21 parallel lane:' "$V21_STATIC_DIR/run-$lane.sh"
  if grep -Fq -- '--trust --format PEM' "$V21_STATIC_DIR/run-$lane.sh"; then
    echo "interactive trust remains in $lane" >&2
    exit 31
  fi
  if grep -Fq -- '--ignore-certificate-errors' "$V21_STATIC_DIR/run-$lane.sh"; then
    echo "certificate bypass remains in $lane" >&2
    exit 32
  fi
done
python3 - "$V21_STATIC_DIR" <<'PY_ASSERT_V21'
import json,pathlib,sys
root=pathlib.Path(sys.argv[1])
receipts=[json.load(open(p)) for p in sorted(root.glob('receipt-*.json'))]
assert {r['lane'] for r in receipts} == {'first_patched','current_net10_revert','current_net11','natural_fix'}
assert len({r['outputRunSha256'] for r in receipts}) == 4
for r in receipts:
    assert r['inputRunSha256']=='55c6470e32a2ed5602ff0a450a587966ad6f40b9a5b88eb7a4d3514edf235906'
print(json.dumps(receipts,indent=2,sort_keys=True))
PY_ASSERT_V21
echo V21_PARALLEL_STATIC_GATE=PASS
echo V20_PATCH_CHAIN_GATE=PASS
'''
          if source.count(old) != 1:
              raise SystemExit(f'v20 final anchor count={source.count(old)}')
          path.write_text(source.replace(old, new, 1))
          PY_INSERT_V21
          chmod 700 /tmp/aspire-v20-reconstruct-v21.sh
          /tmp/aspire-v20-reconstruct-v21.sh

      - name: Upload metadata-only receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aspire-v21-parallel-static-receipts
          path: v21-static/receipt-*.json
          if-no-files-found: warn
          retention-days: 3
          compression-level: 6
