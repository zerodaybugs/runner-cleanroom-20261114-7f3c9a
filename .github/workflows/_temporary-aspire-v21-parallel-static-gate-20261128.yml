name: Validate Aspire v21 parallel lane patcher
# trigger: complete-current-scripts-r5

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/_temporary-aspire-v21-parallel-static-gate-20261128.yml'
      - 'scripts/aspire-v21-lane-selector.py'
      - 'scripts/aspire-v21-inject-static-gate.py'
      - 'scripts/aspire-v21-receipt-gate.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout sealed inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Reconstruct v20 and validate every partition
        shell: bash
        env:
          WRAPPING_KEY_B64: ${{ secrets.PAYLOAD_KEY_B64 }}
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/aspire-v21-lane-selector.py \
            scripts/aspire-v21-inject-static-gate.py \
            scripts/aspire-v21-receipt-gate.py
          cp scripts/aspire-v20-patch-chain-gate.sh /tmp/aspire-v20-reconstruct-v21.sh
          python3 scripts/aspire-v21-inject-static-gate.py /tmp/aspire-v20-reconstruct-v21.sh
          chmod 700 /tmp/aspire-v20-reconstruct-v21.sh
          /tmp/aspire-v20-reconstruct-v21.sh

      - name: Upload metadata-only receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aspire-v21-parallel-static-receipts
          path: v21-static/receipt-*.json
          if-no-files-found: warn
          retention-days: 3
          compression-level: 6
