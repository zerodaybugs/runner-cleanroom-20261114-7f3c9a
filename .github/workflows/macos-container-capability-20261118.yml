name: macOS container capability 20261118

on:
  push:
    branches:
      - research/macos-capability-probe-20261118
    paths:
      - '.github/workflows/macos-container-capability-20261118.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridged:
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Test bridged Colima host reachability
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          uname -a
          sysctl kern.hv_support
          brew install colima docker docker-compose
          colima version
          sudo -n true
          colima start --cpu 2 --memory 4 --disk 12 --runtime docker --vm-type vz --network-address --network-mode bridged --network-interface en0
          trap 'colima stop --force 2>/dev/null || true' EXIT
          docker version
          docker info
          echo '=== COLIMA STATUS ==='
          colima status
          echo '=== MAC NETWORK ==='
          ifconfig en0
          HOST_EN0_IP="$(ipconfig getifaddr en0 || true)"
          echo "HOST_EN0_IP=$HOST_EN0_IP"
          echo '=== VM NETWORK ==='
          colima ssh -- ip -br address
          colima ssh -- ip route
          colima ssh -- getent hosts host.docker.internal || true
          echo '=== CONTAINER DNS ==='
          docker run --rm alpine:3.22 sh -c 'cat /etc/resolv.conf; getent hosts host.docker.internal || true; getent hosts host.lima.internal || true'
          python3 -m http.server 18080 --bind 0.0.0.0 >/tmp/host-http.log 2>&1 &
          host_pid=$!
          trap 'kill $host_pid 2>/dev/null || true; colima stop --force 2>/dev/null || true' EXIT
          sleep 2
          echo '=== LOCAL HOST CONTROL ==='
          curl -sv --max-time 5 http://127.0.0.1:18080/ 2>&1
          echo '=== CONTAINER TO HOST.DOCKER.INTERNAL ==='
          set +e
          docker run --rm alpine:3.22 sh -c 'apk add --no-cache curl >/dev/null; curl -sv --max-time 8 http://host.docker.internal:18080/' 2>&1
          rc_docker=$?
          echo "HOST_DOCKER_INTERNAL_RC=$rc_docker"
          echo '=== CONTAINER TO HOST.LIMA.INTERNAL ==='
          docker run --rm alpine:3.22 sh -c 'apk add --no-cache curl >/dev/null; curl -sv --max-time 8 http://host.lima.internal:18080/' 2>&1
          rc_lima=$?
          echo "HOST_LIMA_INTERNAL_RC=$rc_lima"
          if [ -n "$HOST_EN0_IP" ]; then
            echo '=== CONTAINER TO EN0 IP ==='
            docker run --rm alpine:3.22 sh -c "apk add --no-cache curl >/dev/null; curl -sv --max-time 8 http://$HOST_EN0_IP:18080/" 2>&1
            rc_en0=$?
            echo "HOST_EN0_RC=$rc_en0"
          else
            rc_en0=125
          fi
          set -e
          cat /tmp/host-http.log || true
          if [ "$rc_docker" -eq 0 ] || [ "$rc_lima" -eq 0 ] || [ "$rc_en0" -eq 0 ]; then
            echo 'BRIDGED_HOST_REACHABILITY=PASS'
          else
            echo 'BRIDGED_HOST_REACHABILITY=FAIL'
            exit 42
          fi
