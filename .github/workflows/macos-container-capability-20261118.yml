name: macOS container capability 20261118

on:
  push:
    branches:
      - research/macos-capability-probe-20261118
    paths:
      - '.github/workflows/macos-container-capability-20261118.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  colima:
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install and start Colima
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          uname -a
          sysctl kern.hv_support
          brew install colima docker docker-compose
          colima version
          colima start --cpu 2 --memory 4 --disk 12 --runtime docker --vm-type vz
          docker version
          docker info
          docker run --rm alpine:3.22 sh -c 'uname -a; cat /etc/resolv.conf; getent hosts host.docker.internal || true; getent hosts host.lima.internal || true'
          python3 -m http.server 18080 --bind 0.0.0.0 >/tmp/host-http.log 2>&1 &
          host_pid=$!
          trap 'kill $host_pid 2>/dev/null || true; colima stop --force 2>/dev/null || true' EXIT
          sleep 2
          docker run --rm alpine:3.22 sh -c 'apk add --no-cache curl >/dev/null; echo ===docker-internal===; curl -sv --max-time 5 http://host.docker.internal:18080/ 2>&1 || true; echo ===lima-internal===; curl -sv --max-time 5 http://host.lima.internal:18080/ 2>&1 || true'
          echo 'COLIMA_CAPABILITY_PROBE=PASS'
