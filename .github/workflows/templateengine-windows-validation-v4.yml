name: Sealed Windows TemplateEngine TOCTOU validation v4

on:
  push:
    branches:
      - research/templateengine-windows-sealed-20261119-v1
    paths:
      - '.github/workflows/templateengine-windows-validation-v4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        sdk: ['10.0.404', '11.0.100']
    runs-on: windows-2025
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.sdk }}

      - name: Pin and verify exact SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = '${{ matrix.sdk }}'
          $global = [ordered]@{
            sdk = [ordered]@{
              version = $sdk
              rollForward = 'disable'
              allowPrerelease = $false
            }
          } | ConvertTo-Json -Depth 4
          [IO.File]::WriteAllText((Join-Path $PWD 'global.json'), $global, [Text.UTF8Encoding]::new($false))
          $actual = (& dotnet --version).Trim()
          if ($actual -ne $sdk) { throw "exact SDK pin failed expected=$sdk actual=$actual" }
          Write-Host "EXACT_SDK_PIN=PASS SDK=$actual"

      - name: Assemble and verify sealed payload transport
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $prefix = 'templateengine-windows-v4'
          $parts = @(Get-ChildItem -LiteralPath $PWD -Filter "$prefix.enc.b64.part*" | Sort-Object Name)
          if ($parts.Count -ne 5) { throw "unexpected ciphertext part count: $($parts.Count)" }
          $joined = ($parts | ForEach-Object { (Get-Content -LiteralPath $_.FullName -Raw).Trim() }) -join ''
          [IO.File]::WriteAllText((Join-Path $PWD "$prefix.enc.b64"), $joined, [Text.Encoding]::ASCII)
          $cipher = [Convert]::FromBase64String($joined)
          $actual = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($cipher)).ToLowerInvariant()
          $expected = (Get-Content -LiteralPath "$prefix.cipher.sha256" -Raw).Trim().ToLowerInvariant()
          if ($actual -ne $expected) { throw "ciphertext hash mismatch: $actual" }
          Write-Host 'SEALED_PAYLOAD_TRANSPORT=PASS'

      - name: Run private Windows validation
        shell: pwsh
        env:
          WRAPPING_KEY_B64: ${{ secrets.PAYLOAD_KEY_B64 }}
          SDK_VERSION: ${{ matrix.sdk }}
        run: |
          $ErrorActionPreference = 'Stop'
          $prefix = 'templateengine-windows-v4'
          $payloadGz = Join-Path $PWD "$prefix.payload.ps1.gz"
          $payload = Join-Path $PWD "$prefix.payload.ps1"
          $bootstrap = Join-Path $env:RUNNER_TEMP ("evidence-templateengine-windows-bootstrap-{0}-{1}" -f $env:SDK_VERSION,[Guid]::NewGuid().ToString('N').Substring(0,8))
          New-Item -ItemType Directory -Force -Path $bootstrap | Out-Null
          Copy-Item -LiteralPath (Join-Path $PWD 'global.json') -Destination (Join-Path $bootstrap 'workspace-global.json') -Force
          (& dotnet --info | Out-String) | Set-Content -LiteralPath (Join-Path $bootstrap 'orchestrator-dotnet-info.txt') -Encoding utf8
          ./scripts/run-sealed-payload.ps1 -PayloadPrefix $prefix -OutputPath $payloadGz
          $input = [IO.File]::OpenRead($payloadGz)
          try {
            $gzip = [IO.Compression.GZipStream]::new($input, [IO.Compression.CompressionMode]::Decompress)
            try {
              $output = [IO.File]::Create($payload)
              try { $gzip.CopyTo($output) } finally { $output.Dispose() }
            } finally { $gzip.Dispose() }
          } finally { $input.Dispose() }
          try {
            $stdout = Join-Path $bootstrap 'payload.stdout.txt'
            $stderr = Join-Path $bootstrap 'payload.stderr.txt'
            $proc = Start-Process -FilePath pwsh -ArgumentList @('-NoLogo','-NoProfile','-ExecutionPolicy','Bypass','-File',$payload) -RedirectStandardOutput $stdout -RedirectStandardError $stderr -Wait -PassThru
            [ordered]@{
              exit_code = $proc.ExitCode
              sdk_expected = $env:SDK_VERSION
              sdk_actual = (& dotnet --version).Trim()
              utc = [DateTime]::UtcNow.ToString('O')
            } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $bootstrap 'payload-exit.json') -Encoding utf8
            if ($proc.ExitCode -ne 0) { throw "private validation failed: $($proc.ExitCode)" }
          }
          finally {
            Remove-Item -LiteralPath $payload,$payloadGz -Force -ErrorAction SilentlyContinue
          }

      - name: Seal private evidence
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $prefix = 'templateengine-windows-v4'
          $runtimeKeyPath = Join-Path $PWD "$prefix.runtime.key"
          if (-not (Test-Path -LiteralPath $runtimeKeyPath)) { throw 'runtime evidence key unavailable' }

          $publicPemPath = Join-Path $PWD 'templateengine-windows-researcher-public.pem'
          $publicPem = Get-Content -LiteralPath $publicPemPath -Raw
          $rsa = [Security.Cryptography.RSA]::Create()
          try {
            $rsa.ImportFromPem($publicPem)
            $runtimeKey = [IO.File]::ReadAllBytes($runtimeKeyPath)
            $wrappedResearcherKey = $rsa.Encrypt($runtimeKey, [Security.Cryptography.RSAEncryptionPadding]::OaepSHA256)
          }
          finally { $rsa.Dispose() }
          $wrappedResearcherKeyB64 = [Convert]::ToBase64String($wrappedResearcherKey)
          $wrappedResearcherKeyHash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($wrappedResearcherKey)).ToLowerInvariant()
          $researcherPublicHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $publicPemPath).Hash.ToLowerInvariant()

          $sealedDir = Join-Path $PWD 'sealed-templateengine-evidence'
          ./scripts/seal-evidence.ps1 `
            -PayloadPrefix $prefix `
            -EvidenceFilter 'evidence-templateengine-windows-*' `
            -OutputDirectory $sealedDir `
            -Metadata 'SDK=${{ matrix.sdk }};RUN_ID=${{ github.run_id }};SOURCE_SHA=${{ github.sha }};RUNNER=${{ runner.name }};PAYLOAD=v4'

          $wrappedResearcherKeyB64 | Set-Content (Join-Path $sealedDir 'researcher-key.enc.b64') -Encoding ascii
          $wrappedResearcherKeyHash | Set-Content (Join-Path $sealedDir 'researcher-key.cipher.sha256') -Encoding ascii
          $researcherPublicHash | Set-Content (Join-Path $sealedDir 'researcher-public.sha256') -Encoding ascii
          Write-Host "SEALED_TEMPLATEENGINE_EVIDENCE=PASS SDK=${{ matrix.sdk }}"

      - name: Upload sealed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: templateengine-windows-v4-sealed-${{ matrix.sdk }}
          path: sealed-templateengine-evidence
          if-no-files-found: error
          retention-days: 3
