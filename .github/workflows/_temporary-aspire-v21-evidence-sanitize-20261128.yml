name: Sanitize Aspire v21 matrix evidence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_temporary-aspire-v21-evidence-sanitize-20261128.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  sanitize-v21-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout sealed inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Decrypt and sanitize exact v21 evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WRAPPING_KEY_B64: ${{ secrets.PAYLOAD_KEY_B64 }}
          SOURCE_RUN_ID: '46125294353'
          SOURCE_ARTIFACT_ID: '15256426239'
          SOURCE_SHA: '5cc0733c02acfc45ce076a1be356ab544c825220'
        run: |
          set -euo pipefail
          umask 077
          test -n "$WRAPPING_KEY_B64"
          mkdir -p work/artifact work/raw sanitized

          printf '%s' "$WRAPPING_KEY_B64" | openssl base64 -d -A > work/wrapping.key
          test "$(wc -c < work/wrapping.key | tr -d ' ')" = 32
          WRAP_KEY_HEX="$(od -An -tx1 -v work/wrapping.key | tr -d ' \n')"
          openssl enc -d -aes-256-cbc \
            -K "$WRAP_KEY_HEX" \
            -iv "$(tr -d '\r\n ' < bootstrap/private.iv.hex)" \
            -in bootstrap/private.pem.enc \
            -out work/private.pem

          tr -d '\r\n ' < sealed/aspire-macos-matrix-v2.key.enc.b64 | \
            openssl base64 -d -A > work/payload.key.enc
          test "$(sha256sum work/payload.key.enc | awk '{print $1}')" = \
            'be22571a034deff9daca1291cecadcdddfd98e79f49ee4e4cd548eb5bff2b2ad'
          openssl pkeyutl -decrypt \
            -inkey work/private.pem \
            -in work/payload.key.enc \
            -out work/matrix.runtime.key \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256
          test "$(wc -c < work/matrix.runtime.key | tr -d ' ')" = 32

          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip" \
            -o work/artifact.zip
          unzip -q work/artifact.zip -d work/artifact
          grep -qx "RUN_ID=$SOURCE_RUN_ID" work/artifact/metadata.txt
          grep -qx "SOURCE_SHA=$SOURCE_SHA" work/artifact/metadata.txt
          test "$(sha256sum work/artifact/evidence.enc | awk '{print $1}')" = \
            "$(tr -d '\r\n ' < work/artifact/evidence.cipher.sha256)"

          KEY_HEX="$(od -An -tx1 -v work/matrix.runtime.key | tr -d ' \n')"
          openssl enc -d -aes-256-cbc \
            -K "$KEY_HEX" \
            -iv "$(tr -d '\r\n ' < work/artifact/evidence.iv.hex)" \
            -in work/artifact/evidence.enc \
            -out work/evidence.plain.zip
          test "$(sha256sum work/evidence.plain.zip | awk '{print $1}')" = \
            "$(tr -d '\r\n ' < work/artifact/evidence.plain.sha256)"
          unzip -q work/evidence.plain.zip -d work/raw

          python3 - work/raw sanitized work/artifact/metadata.txt <<'PY_SANITIZE'
          import hashlib, json, pathlib, re, shutil, sys

          raw_root, out_root, metadata_path = map(pathlib.Path, sys.argv[1:])
          roots = [p for p in raw_root.iterdir() if p.is_dir()]
          if len(roots) != 1:
              raise SystemExit(f'expected one evidence root, got {len(roots)}')
          root = roots[0]

          exact = {
              'status.txt','assertion.txt','readiness.txt','workflow-status.txt','bootstrap-status.txt',
              'devcert-gate.txt','devcert-clean.log','devcert-create-export.log','devcert-system-trust.log',
              'devcert-check-trust.log','devcert-security-verify.log','devcert-public-metadata.txt',
              'framework-lane.txt','login-token-shape.json','post-browser-health.json','browser-result.json',
              'browser.stdout','browser.stderr','apphost.log','apphost-tail.txt','build.log','dotnet-lane.txt',
              'dcp-scope-assertion.json','dcp-dashboard-services.json','dcp-services.json','dcp-tunnels.json',
              'docker-ps-a.txt','docker-ps-final.txt','capture-meta.json','matrix-summary.json',
              'fix-build.log','fix-build-status.txt','revert-status.txt','natural-fix.patch','fix-dll.sha256',
              'aspire-hosting-before-replacement.sha256','aspire-hosting-loaded.sha256',
              'exported-stock-dll.sha256','apphost-dll.sha256','victim-pids.txt','victim-pid-log-stat.txt',
              'container-ca-load.txt','yarp-tls-handshake.txt','proxyless-service.json','container-inspect.json',
              'attacker-container-inspect.json','executed-run-hashes.txt','patched-hashes.txt',
              'PATCH_CHAIN.json','V13_PATCH_MANIFEST.json','bootstrap-trace.log','runner-provenance.txt',
              'dotnet-info.txt','dotnet-list-sdks.txt','dotnet-list-runtimes.txt','docker-version.txt',
              'uname.txt','sw_vers.txt'
          }
          prefixes = ('HARNESS_','patch-','lane-','result','attacker-','proxyless-','yarp-')
          max_bytes = 12 * 1024 * 1024

          private_key = re.compile(
              r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----.*?'
              r'-----END (?:RSA |EC |OPENSSH )?PRIVATE KEY-----', re.I | re.S)
          substitutions = [
              (re.compile(r'([?&](?:t|token|access_token|code)=)[^&\s"\']+', re.I), r'\1<REDACTED>'),
              (re.compile(r'(?im)^((?:authorization|proxy-authorization)\s*:\s*).+$'), r'\1<REDACTED>'),
              (re.compile(r'(?im)^((?:cookie|set-cookie|x-api-key|x-otlp-api-key)\s*:\s*).+$'), r'\1<REDACTED>'),
              (re.compile(r'(?i)(\.Aspire\.Dashboard\.Auth[^=;\s"\']*=)[^;\s"\']+'), r'\1<REDACTED>'),
              (re.compile(r'(?i)(\.AspNetCore\.[A-Za-z0-9_.-]+=)[^;\s"\']+'), r'\1<REDACTED>'),
              (re.compile(r'(?im)^(ASPIRE_DASHBOARD_FRONTEND_BROWSERTOKEN=).+$'), r'\1<REDACTED>'),
              (re.compile(r'(?i)((?:browser_token|PAYLOAD_KEY_B64|WRAPPING_KEY_B64)[=:]\s*)[^\s"\']+'), r'\1<REDACTED>')
          ]
          safe_json = {
              'cookieleak','cookiebytes','cookiesha256','cookieheadersha256',
              'authcookienamesha256','authcookievaluesha256','tokenlength',
              'tokenislowerhex32','loginurlsha256','dashboardhttpsready'
          }

          def digest(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()

          def redact(text: str) -> str:
              text = private_key.sub('<PRIVATE_KEY_REDACTED>', text)
              for pattern, replacement in substitutions:
                  text = pattern.sub(replacement, text)
              return text

          def clean_json(value, key=''):
              lower = key.lower()
              if isinstance(value, dict):
                  return {k: clean_json(v, k) for k, v in value.items()}
              if isinstance(value, list):
                  return [clean_json(v, key) for v in value]
              if isinstance(value, str):
                  sensitive = any(term in lower for term in (
                      'cookie','token','authorization','password','secret','privatekey','private_key','apikey','api_key'))
                  safe = lower in safe_json or 'sha256' in lower or lower.endswith('hash')
                  return '<REDACTED>' if sensitive and not safe else redact(value)
              return value

          inventory, skipped, tree = [], [], []
          for src in sorted(root.rglob('*')):
              if not src.is_file():
                  continue
              rel, name, size = src.relative_to(root), src.name, src.stat().st_size
              tree.append(f'{size:>12}  {rel}')
              if not (name in exact or any(name.startswith(p) for p in prefixes)) or size > max_bytes:
                  skipped.append({'path':str(rel),'bytes':size,'reason':'not-whitelisted-or-too-large'})
                  continue
              data = src.read_bytes()
              if b'\x00' in data[:8192]:
                  skipped.append({'path':str(rel),'bytes':size,'reason':'binary'})
                  continue
              text = data.decode('utf-8', errors='replace')
              if name == 'bootstrap-trace.log':
                  lines = text.splitlines()
                  marker = re.compile(
                      r'(run_lane|first_patched|current_17|natural_fix|revert|status\.txt|assertion|'
                      r'readiness|dashboard|apphost|yarp|proxyless|cookie|replay|lifecycle|failed|error|'
                      r'exception|MATRIX_RC|DEVCERT)', re.I)
                  selected = lines[:300] + [line for line in lines if marker.search(line)] + lines[-1800:]
                  seen, compact = set(), []
                  for line in selected:
                      if line not in seen:
                          compact.append(line); seen.add(line)
                  text = '\n'.join(compact) + '\n'
              if name.endswith('.json'):
                  try:
                      text = json.dumps(clean_json(json.loads(text)), indent=2, sort_keys=True) + '\n'
                  except Exception:
                      text = redact(text)
              else:
                  text = redact(text)
              dst = out_root / rel
              dst.parent.mkdir(parents=True, exist_ok=True)
              dst.write_text(text)
              inventory.append({'path':str(rel),'sourceBytes':size,'sanitizedBytes':dst.stat().st_size,'sha256':digest(dst.read_bytes())})

          (out_root/'TREE.txt').write_text('\n'.join(tree)+'\n')
          shutil.copyfile(metadata_path, out_root/'ci-artifact-metadata.txt')
          report = {
              'schema':1,'sourceRunId':46125294353,'sourceArtifactId':15256426239,
              'sourceEvidenceRoot':root.name,'copiedFiles':len(inventory),'skippedFiles':len(skipped),
              'binaryFilesCopied':0,'inventory':inventory,'skipped':skipped
          }
          (out_root/'SANITIZE_REPORT.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          sums=[]
          for path in sorted(out_root.rglob('*')):
              if path.is_file() and path.name != 'SHA256SUMS.txt':
                  sums.append(f'{digest(path.read_bytes())}  {path.relative_to(out_root)}')
          (out_root/'SHA256SUMS.txt').write_text('\n'.join(sums)+'\n')
          print(json.dumps({'copied':len(inventory),'skipped':len(skipped)},sort_keys=True))
          PY_SANITIZE

          if grep -RInaE --binary-files=without-match \
            'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|Authorization:[[:space:]]*(Bearer|Basic)[[:space:]]+[^<]|Cookie:[[:space:]]*[^<]|Set-Cookie:[[:space:]]*[^<]|ASPIRE_DASHBOARD_FRONTEND_BROWSERTOKEN=[^<]|[?&](t|token|access_token|code)=[^<&[:space:]]+' \
            sanitized; then
            echo 'SANITIZED_SECRET_SCAN=FAIL' >&2
            exit 91
          fi
          echo 'SANITIZED_SECRET_SCAN=PASS'
          test -s sanitized/SANITIZE_REPORT.json
          test -s sanitized/TREE.txt
          test -s sanitized/SHA256SUMS.txt
          rm -rf work

      - name: Upload sanitized v21 diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aspire-v21-sanitized-46125294353
          path: sanitized
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
