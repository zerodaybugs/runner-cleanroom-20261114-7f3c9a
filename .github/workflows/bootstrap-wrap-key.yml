name: Bootstrap Wrapped Validation Key

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Generate one-time wrapped RSA key
        shell: bash
        env:
          WRAPPING_KEY_B64: ${{ secrets.PAYLOAD_KEY_B64 }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "${WRAPPING_KEY_B64:-}" ]; then
            echo "WRAPPING_KEY_MISSING"
            exit 1
          fi
          printf '%s' "$WRAPPING_KEY_B64" | base64 -d > wrapping.key
          if [ "$(wc -c < wrapping.key)" -ne 32 ]; then
            echo "WRAPPING_KEY_INVALID_LENGTH"
            exit 1
          fi
          rm -rf bootstrap
          mkdir -p bootstrap
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out private.pem >/dev/null 2>&1
          openssl pkey -in private.pem -pubout -out bootstrap/public.pem >/dev/null 2>&1
          iv_hex="$(openssl rand -hex 16)"
          key_hex="$(xxd -p -c 256 wrapping.key)"
          openssl enc -aes-256-cbc -K "$key_hex" -iv "$iv_hex" -in private.pem -out bootstrap/private.pem.enc
          printf '%s\n' "$iv_hex" > bootstrap/private.iv.hex
          public_sha256="$(sha256sum bootstrap/public.pem | awk '{print $1}')"
          private_enc_sha256="$(sha256sum bootstrap/private.pem.enc | awk '{print $1}')"
          cat > bootstrap/metadata.txt <<EOF
          BOOTSTRAP_VERSION=2
          PUBLIC_SHA256=$public_sha256
          PRIVATE_ENC_SHA256=$private_enc_sha256
          WRAPPING_ALGORITHM=AES-256-CBC
          PRIVATE_KEY_ALGORITHM=RSA-3072
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bootstrap
          git commit -m "Rotate wrapped validation key"
          git push origin HEAD:main
          echo "BOOTSTRAP_PUBLIC_SHA256=$public_sha256"
          echo "BOOTSTRAP_PRIVATE_ENC_SHA256=$private_enc_sha256"
          echo "BOOTSTRAP_RESULT=PASS"
          rm -f wrapping.key private.pem
