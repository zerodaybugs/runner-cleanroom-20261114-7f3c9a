name: Windows IPv6 Scope Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Probe two existing IPv6 interface scopes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $address = 'fe80::42'
          $port = 18081
          $added = @()
          $listenerA = $null
          $listenerB = $null

          function Matches-ProbeAddress($row) {
            return (($row.IPAddress -split '%')[0] -eq $address)
          }

          function Write-Snapshot([string]$label) {
            Write-Host "===== $label / adapters ====="
            Get-NetAdapter -IncludeHidden | Sort-Object ifIndex | Format-Table -AutoSize | Out-String -Width 260 | Write-Host
            Write-Host "===== $label / IPv6 interfaces ====="
            Get-NetIPInterface -AddressFamily IPv6 | Sort-Object InterfaceIndex | Format-Table -AutoSize | Out-String -Width 260 | Write-Host
            Write-Host "===== $label / IPv6 addresses ====="
            Get-NetIPAddress -AddressFamily IPv6 | Sort-Object InterfaceIndex,IPAddress | Format-Table -AutoSize | Out-String -Width 260 | Write-Host
          }

          try {
            Write-Host "WHOAMI=$(& whoami.exe)"
            Write-Host "ADMIN=$(([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator))"
            Write-Snapshot 'BEFORE'

            $selected = @(Get-NetIPInterface -AddressFamily IPv6 |
              Where-Object {
                $_.ConnectionState -eq 'Connected' -and
                $_.InterfaceAlias -notmatch 'Loopback|isatap|Teredo'
              } |
              Sort-Object InterfaceIndex |
              Select-Object -First 2)
            if ($selected.Count -lt 2) { throw "Need two connected non-loopback IPv6 interfaces; found $($selected.Count)" }

            $ifA = [int]$selected[0].InterfaceIndex
            $ifB = [int]$selected[1].InterfaceIndex
            Write-Host "SELECTED_IF_A=$ifA ALIAS=$($selected[0].InterfaceAlias)"
            Write-Host "SELECTED_IF_B=$ifB ALIAS=$($selected[1].InterfaceAlias)"

            foreach ($idx in @($ifA,$ifB)) {
              Set-NetIPInterface -InterfaceIndex $idx -AddressFamily IPv6 -DadTransmits 0 -RouterDiscovery Disabled -ErrorAction SilentlyContinue
              Get-NetIPAddress -InterfaceIndex $idx -AddressFamily IPv6 -ErrorAction SilentlyContinue |
                Where-Object { Matches-ProbeAddress $_ } |
                Remove-NetIPAddress -Confirm:$false -ErrorAction SilentlyContinue
              $created = New-NetIPAddress -InterfaceIndex $idx -AddressFamily IPv6 -IPAddress $address -PrefixLength 64 -SkipAsSource $false -PolicyStore ActiveStore -ErrorAction Stop
              Write-Host "CREATE_IF_${idx}=$($created.IPAddress) STATE=$($created.AddressState)"
              $added += $idx
            }

            Start-Sleep -Seconds 2
            $aRows = @(Get-NetIPAddress -InterfaceIndex $ifA -AddressFamily IPv6 | Where-Object { Matches-ProbeAddress $_ })
            $bRows = @(Get-NetIPAddress -InterfaceIndex $ifB -AddressFamily IPv6 | Where-Object { Matches-ProbeAddress $_ })
            Write-Host "ASSIGNMENT_A_COUNT=$($aRows.Count) VALUE=$($aRows.IPAddress -join ',')"
            Write-Host "ASSIGNMENT_B_COUNT=$($bRows.Count) VALUE=$($bRows.IPAddress -join ',')"
            if ($aRows.Count -ne 1 -or $bRows.Count -ne 1) { throw 'Duplicate link-local assignment verification failed' }

            $ipA = [Net.IPAddress]::Parse("${address}%${ifA}")
            $ipB = [Net.IPAddress]::Parse("${address}%${ifB}")
            Write-Host "PARSED_A=$ipA SCOPE=$($ipA.ScopeId)"
            Write-Host "PARSED_B=$ipB SCOPE=$($ipB.ScopeId)"

            $listenerA = [Net.Sockets.TcpListener]::new($ipA,$port)
            $listenerB = [Net.Sockets.TcpListener]::new($ipB,$port)
            $listenerA.Server.ExclusiveAddressUse = $true
            $listenerB.Server.ExclusiveAddressUse = $true
            $listenerA.Start()
            $listenerB.Start()
            Write-Host "LISTENER_A=$($listenerA.LocalEndpoint)"
            Write-Host "LISTENER_B=$($listenerB.LocalEndpoint)"

            $acceptA = $listenerA.AcceptTcpClientAsync()
            $acceptB = $listenerB.AcceptTcpClientAsync()
            $clientA = [Net.Sockets.TcpClient]::new([Net.Sockets.AddressFamily]::InterNetworkV6)
            $clientB = [Net.Sockets.TcpClient]::new([Net.Sockets.AddressFamily]::InterNetworkV6)
            try {
              $clientA.ConnectAsync($ipA,$port).Wait([TimeSpan]::FromSeconds(10)) | Out-Null
              $clientB.ConnectAsync($ipB,$port).Wait([TimeSpan]::FromSeconds(10)) | Out-Null
              if (-not $clientA.Connected -or -not $clientB.Connected) { throw 'Scoped client connection failed' }
              if (-not $acceptA.Wait([TimeSpan]::FromSeconds(10))) { throw 'Listener A did not accept' }
              if (-not $acceptB.Wait([TimeSpan]::FromSeconds(10))) { throw 'Listener B did not accept' }
              $acceptedA = $acceptA.Result
              $acceptedB = $acceptB.Result
              try {
                Write-Host "ACCEPTED_A_LOCAL=$($acceptedA.Client.LocalEndPoint) REMOTE=$($acceptedA.Client.RemoteEndPoint)"
                Write-Host "ACCEPTED_B_LOCAL=$($acceptedB.Client.LocalEndPoint) REMOTE=$($acceptedB.Client.RemoteEndPoint)"
              }
              finally {
                $acceptedA.Dispose()
                $acceptedB.Dispose()
              }
            }
            finally {
              $clientA.Dispose()
              $clientB.Dispose()
            }

            Write-Snapshot 'AFTER'
            Write-Host 'PROBE_RESULT=PASS'
          }
          finally {
            if ($listenerA) { $listenerA.Stop() }
            if ($listenerB) { $listenerB.Stop() }
            foreach ($idx in $added) {
              Get-NetIPAddress -InterfaceIndex $idx -AddressFamily IPv6 -ErrorAction SilentlyContinue |
                Where-Object { Matches-ProbeAddress $_ } |
                Remove-NetIPAddress -Confirm:$false -ErrorAction SilentlyContinue
            }
          }
