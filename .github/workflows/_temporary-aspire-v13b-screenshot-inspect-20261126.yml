name: Export sanitized Aspire v13b forensic diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_temporary-aspire-v13b-screenshot-inspect-20261126.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout sealed inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Decrypt and prepare sanitized forensic diagnostics
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WRAPPING_KEY_B64: ${{ secrets.PAYLOAD_KEY_B64 }}
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/zerodaybugs/runner-cleanroom-20261114-7f3c9a/actions/artifacts/15130728985/zip -o artifact.zip
          test "$(sha256sum artifact.zip | awk '{print $1}')" = "54decf88e7e0f7972591bbf6b46b4fbaeda1a7ee633d2d01c9ae5b4cd02fd897"
          mkdir artifact evidence safe-forensics
          unzip -q artifact.zip -d artifact

          printf '%s' "$WRAPPING_KEY_B64" | openssl base64 -d -A > wrapping.key
          test "$(wc -c < wrapping.key | tr -d ' ')" = "32"
          WRAP_KEY_HEX="$(od -An -tx1 -v wrapping.key | tr -d ' \n')"
          openssl enc -d -aes-256-cbc -K "$WRAP_KEY_HEX" \
            -iv "$(tr -d '\r\n ' < bootstrap/private.iv.hex)" \
            -in bootstrap/private.pem.enc -out private.pem
          tr -d '\r\n ' < sealed/aspire-macos-matrix-v2.key.enc.b64 | openssl base64 -d -A > payload.key.enc
          openssl pkeyutl -decrypt -inkey private.pem -in payload.key.enc -out runtime.key \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256
          test "$(wc -c < runtime.key | tr -d ' ')" = "32"

          test "$(sha256sum artifact/evidence.enc | awk '{print $1}')" = "$(tr -d '\r\n ' < artifact/evidence.cipher.sha256)"
          KEY_HEX="$(od -An -tx1 -v runtime.key | tr -d ' \n')"
          openssl enc -d -aes-256-cbc -K "$KEY_HEX" \
            -iv "$(tr -d '\r\n ' < artifact/evidence.iv.hex)" \
            -in artifact/evidence.enc -out evidence.zip
          test "$(sha256sum evidence.zip | awk '{print $1}')" = "$(tr -d '\r\n ' < artifact/evidence.plain.sha256)"
          unzip -q evidence.zip -d evidence
          ROOT="$(find evidence -mindepth 1 -maxdepth 1 -type d | head -1)"
          test -n "$ROOT"

          python3 - "$ROOT" safe-forensics <<'PY'
          import json
          import pathlib
          import re
          import sys

          root = pathlib.Path(sys.argv[1])
          out = pathlib.Path(sys.argv[2])
          allowed = {
              'assertion.txt', 'readiness.txt', 'status.txt', 'workflow-status.txt',
              'bootstrap-status.txt', 'dcp-scope-assertion.json', 'browser-result.json',
              'browser.stderr', 'browser.stdout', 'apphost.log', 'apphost-tail.txt',
              'docker-ps-a.txt', 'docker-ps-final.txt', 'patch-v11-status.txt',
              'patch-v13-status.txt', 'natural-fix.patch', 'fix-build.log',
              'fix-dll.sha256', 'aspire-hosting-loaded.sha256',
              'aspire-hosting-before-replacement.sha256', 'exported-stock-dll.sha256',
              'patched-hashes.txt', 'PATCH_CHAIN.json', 'V13_PATCH_MANIFEST.json',
              'matrix-summary.json'
          }
          token_patterns = [
              (re.compile(r'([?&](?:t|token|access_token|code)=)[^&\s"\']+', re.I), r'\1<REDACTED>'),
              (re.compile(r'(?im)^(authorization\s*:\s*).+$'), r'\1<REDACTED>'),
              (re.compile(r'(?im)^(cookie\s*:\s*).+$'), r'\1<REDACTED>'),
              (re.compile(r'(?i)(\.AspNetCore\.[A-Za-z0-9_.-]+=)[^;\s]+'), r'\1<REDACTED>'),
          ]

          def sanitize_text(text: str) -> str:
              for pattern, repl in token_patterns:
                  text = pattern.sub(repl, text)
              return text

          inventory = []
          for src in sorted(root.rglob('*')):
              if not src.is_file() or src.name not in allowed:
                  continue
              rel = src.relative_to(root)
              dst = out / rel
              dst.parent.mkdir(parents=True, exist_ok=True)
              try:
                  text = src.read_text(errors='replace')
              except Exception as exc:
                  text = f'READ_ERROR={type(exc).__name__}: {exc}\n'
              dst.write_text(sanitize_text(text))
              inventory.append(str(rel))
          (out / 'INVENTORY.json').write_text(json.dumps(inventory, indent=2))
          PY

          find safe-forensics -type f -print0 | sort -z | xargs -0 sha256sum > safe-forensics/SHA256SUMS.txt
          rm -rf artifact evidence artifact.zip evidence.zip wrapping.key private.pem payload.key.enc runtime.key

      - name: Upload sanitized forensic diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aspire-v13b-sanitized-forensic-diagnostics
          path: safe-forensics
          if-no-files-found: error
          retention-days: 3
          compression-level: 6
