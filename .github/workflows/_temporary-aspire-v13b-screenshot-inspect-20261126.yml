name: Export sanitized Aspire v13b navigation diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_temporary-aspire-v13b-screenshot-inspect-20261126.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout sealed inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Decrypt and prepare sanitized diagnostics
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WRAPPING_KEY_B64: ${{ secrets.PAYLOAD_KEY_B64 }}
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/zerodaybugs/runner-cleanroom-20261114-7f3c9a/actions/artifacts/15130728985/zip -o artifact.zip
          test "$(sha256sum artifact.zip | awk '{print $1}')" = "54decf88e7e0f7972591bbf6b46b4fbaeda1a7ee633d2d01c9ae5b4cd02fd897"
          mkdir artifact evidence safe-diagnostics
          unzip -q artifact.zip -d artifact
          printf '%s' "$WRAPPING_KEY_B64" | openssl base64 -d -A > wrapping.key
          test "$(wc -c < wrapping.key | tr -d ' ')" = "32"
          WRAP_KEY_HEX="$(od -An -tx1 -v wrapping.key | tr -d ' \n')"
          openssl enc -d -aes-256-cbc -K "$WRAP_KEY_HEX" -iv "$(tr -d '\r\n ' < bootstrap/private.iv.hex)" \
            -in bootstrap/private.pem.enc -out private.pem
          tr -d '\r\n ' < sealed/aspire-macos-matrix-v2.key.enc.b64 | openssl base64 -d -A > payload.key.enc
          openssl pkeyutl -decrypt -inkey private.pem -in payload.key.enc -out runtime.key \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256
          KEY_HEX="$(od -An -tx1 -v runtime.key | tr -d ' \n')"
          openssl enc -d -aes-256-cbc -K "$KEY_HEX" -iv "$(tr -d '\r\n ' < artifact/evidence.iv.hex)" \
            -in artifact/evidence.enc -out evidence.zip
          test "$(sha256sum evidence.zip | awk '{print $1}')" = "$(tr -d '\r\n ' < artifact/evidence.plain.sha256)"
          unzip -q evidence.zip -d evidence
          ROOT="$(find evidence -mindepth 1 -maxdepth 1 -type d | head -1)"
          test -n "$ROOT"

          find "$ROOT" -type f -name '*.png' -print0 | while IFS= read -r -d '' f; do
            lane="$(basename "$(dirname "$f")")"
            cp "$f" "safe-diagnostics/${lane}-$(basename "$f")"
          done
          python3 - "$ROOT" <<'PY'
          import json,pathlib,re,sys
          root=pathlib.Path(sys.argv[1]); out=[]
          for p in sorted(root.glob('*/browser-result.json')):
              try: j=json.load(open(p))
              except Exception as e:
                  out.append({'lane':p.parent.name,'parseError':f'{type(e).__name__}: {e}'})
                  continue
              keep=['lane','aspireVersion','mode','dashboardConnected','linkedServiceOpened','resourceDetailsOpened','endpointLinkFound','endpointLinkClicked','cookieLeak','replayAuthenticated','stockLifecycleExecuted','stopExecuted','startExecuted','errorStage','errorClass','errorMessage','replayError','replayTitle','finalDashboardLinks','lifecycleUiRoute']
              row={k:j.get(k) for k in keep if k in j}
              links=[]
              for x in row.get('finalDashboardLinks') or []:
                  href=str(x.get('href',''))
                  href=re.sub(r'([?&](?:t|token|access_token|code)=)[^&]+',r'\1<REDACTED>',href,flags=re.I)
                  links.append({'text':str(x.get('text',''))[:160],'href':href[:500]})
              row['finalDashboardLinks']=links
              out.append(row)
          json.dump(out,open('safe-diagnostics/sanitized-browser-results.json','w'),indent=2,sort_keys=True)
          PY
          find "$ROOT" -type f \( -name 'readiness.txt' -o -name 'assertion.txt' -o -name 'dcp-scope-assertion.json' \) -print0 | while IFS= read -r -d '' f; do
            lane="$(basename "$(dirname "$f")")"
            cp "$f" "safe-diagnostics/${lane}-$(basename "$f")"
          done
          find safe-diagnostics -type f -print0 | sort -z | xargs -0 sha256sum > safe-diagnostics/SHA256SUMS.txt
          rm -rf artifact evidence artifact.zip evidence.zip wrapping.key private.pem payload.key.enc runtime.key

      - name: Upload sanitized diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aspire-v13b-sanitized-navigation-diagnostics
          path: safe-diagnostics
          if-no-files-found: error
          retention-days: 3
          compression-level: 6