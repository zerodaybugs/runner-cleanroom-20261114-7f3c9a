name: Rewrap Aspire v7 sealed evidence

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/_temporary-rewrap-aspire-v7-evidence-20261125.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  rewrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout key-wrapping inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Download and rewrap sealed evidence key
        shell: bash
        env:
          WRAPPING_KEY_B64: ${{ secrets.PAYLOAD_KEY_B64 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$WRAPPING_KEY_B64"

          printf '%s' "$WRAPPING_KEY_B64" | openssl base64 -d -A > wrapping.key
          test "$(wc -c < wrapping.key | tr -d ' ')" = "32"
          WRAP_KEY_HEX="$(od -An -tx1 -v wrapping.key | tr -d ' \n')"

          openssl enc -d -aes-256-cbc \
            -K "$WRAP_KEY_HEX" \
            -iv "$(tr -d '\r\n ' < bootstrap/private.iv.hex)" \
            -in bootstrap/private.pem.enc \
            -out private.pem

          tr -d '\r\n ' < sealed/aspire-macos-matrix-v2.key.enc.b64 \
            | openssl base64 -d -A > payload.key.enc
          test "$(sha256sum payload.key.enc | awk '{print $1}')" = "be22571a034deff9daca1291cecadcdddfd98e79f49ee4e4cd548eb5bff2b2ad"

          openssl pkeyutl -decrypt \
            -inkey private.pem \
            -in payload.key.enc \
            -out matrix.runtime.key \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256
          test "$(wc -c < matrix.runtime.key | tr -d ' ')" = "32"

          cat > rewrap-public.pem <<'PUBLIC_KEY'
-----BEGIN PUBLIC KEY-----
MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAvZP1PH+ORyilxEnQB/vY
yyRfXcEsJmJjJWC9m/fXA7kJ8v3f/PK4a4Vzfstji44k7DcUOie4pnJujBD8KMKq
sOxPn/bG8w2xlhtN98uAFwhflspR9YWIJ/hxZ2M/Wr+VyGhDJdPqUZV0r3WNQ0My
OxAGYJCAgZ41vr4GYPYd81NgRyh2QdmRzimH2Ij031jWZD0juZxOGnFOU0245RR0
zrBTN7sPa8WUwwNzfhFOc3oxg0ZXce/8x7v5LBiI7ih9SLKbt3nC11i1+9+jA253
NlH4niMXYFJ4G6okDYI9e65gNof4ceX0nk6rGfrsv9r18TwuY27FLNHweERk6gEo
+I8k05KueKxO5LZmqDYCPVlsvXBE1mTRaxS6ECNBcJieysQZJlODd4civJT+Rbpy
vu381Dj/JpXUuW6F+zmCzB0WFnX4fP9FiW/lcIYDLbobM3++mjcu91xCAPLuctye
jaKLuL2m+1BER3A3EaczkqlQC3XggtMnzDzAUBlkVzjJAgMBAAE=
-----END PUBLIC KEY-----
PUBLIC_KEY
          test "$(sha256sum rewrap-public.pem | awk '{print $1}')" = "a35eeb714e6caa9a1061bfcf676934df7b4d5c2cb8f4149791c4a77d6085dd4a"

          openssl pkeyutl -encrypt \
            -pubin \
            -inkey rewrap-public.pem \
            -in matrix.runtime.key \
            -out matrix.runtime.key.rewrapped.enc \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256

          curl -L --fail --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/15050514545/zip" \
            -o sealed-artifact.zip
          test "$(sha256sum sealed-artifact.zip | awk '{print $1}')" = "f879e4d94c92446332a27cd97e770eae98e6badba81baf6578e882450ed240b4"

          mkdir -p rewrapped
          unzip -q sealed-artifact.zip -d rewrapped
          test -f rewrapped/evidence.enc
          test -f rewrapped/evidence.iv.hex
          test -f rewrapped/evidence.plain.sha256
          test -f rewrapped/evidence.cipher.sha256
          test "$(sha256sum rewrapped/evidence.enc | awk '{print $1}')" = "$(tr -d '\r\n ' < rewrapped/evidence.cipher.sha256)"

          mv matrix.runtime.key.rewrapped.enc rewrapped/
          cp rewrap-public.pem rewrapped/
          cat > rewrapped/rewrap-metadata.txt <<EOF
FORMAT=RSA-OAEP-SHA256
ORIGINAL_ARTIFACT_ID=15050514545
ORIGINAL_ARTIFACT_SHA256=f879e4d94c92446332a27cd97e770eae98e6badba81baf6578e882450ed240b4
REWRAP_PUBLIC_KEY_SHA256=a35eeb714e6caa9a1061bfcf676934df7b4d5c2cb8f4149791c4a77d6085dd4a
SOURCE_RUN_ID=45663528366
EOF

          rm -f wrapping.key private.pem payload.key.enc matrix.runtime.key sealed-artifact.zip

      - name: Upload rewrapped sealed evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aspire-v7-rewrapped-evidence-${{ github.sha }}
          path: rewrapped
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
