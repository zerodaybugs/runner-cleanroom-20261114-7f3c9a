name: Audit sealed Aspire attacker replay route

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_temporary-aspire-attacker-route-audit-20261125.yml'

permissions:
  contents: read

jobs:
  route-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Decrypt and classify replay routing without exposing credentials
        shell: bash
        env:
          WRAPPING_KEY_B64: ${{ secrets.PAYLOAD_KEY_B64 }}
        run: |
          set -euo pipefail
          printf '%s' "$WRAPPING_KEY_B64" | openssl base64 -d -A > wrapping.key
          test "$(wc -c < wrapping.key | tr -d ' ')" = 32
          WRAP_KEY_HEX="$(od -An -tx1 -v wrapping.key | tr -d ' \n')"
          openssl enc -d -aes-256-cbc -K "$WRAP_KEY_HEX" -iv "$(tr -d '\r\n ' < bootstrap/private.iv.hex)" -in bootstrap/private.pem.enc -out private.pem
          tr -d '\r\n ' < sealed/aspire-macos-matrix-v2.key.enc.b64 | openssl base64 -d -A > payload.key.enc
          openssl pkeyutl -decrypt -inkey private.pem -in payload.key.enc -out payload.key \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256
          tr -d '\r\n ' < sealed/aspire-macos-matrix-v2.enc.b64 | openssl base64 -d -A > payload.enc
          KEY_HEX="$(od -An -tx1 -v payload.key | tr -d ' \n')"
          openssl enc -d -aes-256-cbc -K "$KEY_HEX" -iv 206224599d55f53eba5616f78531addb -in payload.enc -out payload.zip
          test "$(sha256sum payload.zip | awk '{print $1}')" = ba640f7ae180b198351ff27f579158fabad7a7057261133bc5888dfe2e50a9f9
          mkdir payload
          unzip -q payload.zip -d payload
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          root=Path('payload')
          files=[p for p in root.rglob('*') if p.is_file() and 'attacker' in p.parts]
          print('ATTACKER_FILE_COUNT='+str(len(files)))
          patterns=['host.docker.internal','aspire-dashboard','CONNECT','localhost','socket.create_connection','create_connection','dashboardPort','DASHBOARD']
          for p in sorted(files):
              try: text=p.read_text(errors='strict')
              except Exception: continue
              print('FILE='+str(p.relative_to(root))+' SHA256='+hashlib.sha256(p.read_bytes()).hexdigest())
              for n,line in enumerate(text.splitlines(),1):
                  if any(x.lower() in line.lower() for x in patterns):
                      safe=re.sub(r'([A-Za-z0-9_-]{24,})','<redacted-long-token>',line.strip())
                      print(f'  L{n}: {safe[:500]}')
          PY
          rm -rf payload payload.zip payload.enc payload.key payload.key.enc private.pem wrapping.key
