name: Export verified Aspire v20 harness for private audit
# trigger: private-export-r1

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/_temporary-aspire-v20-argument-contract-audit-20261127.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout sealed clean-room inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Reconstruct exact final v20 harness
        shell: bash
        env:
          WRAPPING_KEY_B64: ${{ secrets.PAYLOAD_KEY_B64 }}
        run: |
          set -euo pipefail
          cp scripts/aspire-v20-patch-chain-gate.sh /tmp/aspire-v20-export.sh
          python3 - /tmp/aspire-v20-export.sh <<'PY_DISABLE_CLEANUP'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          source = path.read_text()
          old = 'trap cleanup EXIT\n'
          if source.count(old) != 1:
              raise SystemExit(f'cleanup trap count={source.count(old)}')
          path.write_text(source.replace(old, '# cleanup deferred for authenticated artifact export\n', 1))
          PY_DISABLE_CLEANUP
          chmod 700 /tmp/aspire-v20-export.sh
          /tmp/aspire-v20-export.sh
          test "$(sha256sum patched-v13/run.sh | awk '{print $1}')" = "55c6470e32a2ed5602ff0a450a587966ad6f40b9a5b88eb7a4d3514edf235906"
          test "$(sha256sum patched-v13/browser.js | awk '{print $1}')" = "e9e33b5ef3a3f3f08779af526bd91fa633f0f52f2f4676d51eb8add2c4eeefbe"
          mkdir export
          install -m 0600 patched-v13/run.sh export/run.sh
          install -m 0600 patched-v13/browser.js export/browser.js
          cp v16-receipt.json v18-receipt.json v20-receipt.json export/
          sha256sum export/* > export/SHA256SUMS.txt

      - name: Upload authenticated short-lived harness artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aspire-v20-private-audit-harness
          path: export
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
