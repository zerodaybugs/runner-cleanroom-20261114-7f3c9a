name: Aspire v20 deterministic patch-chain gate

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/_temporary-aspire-v20-argument-contract-audit-20261127.yml'
      - 'scripts/aspire-v20-patch-chain-gate.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-chain-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout sealed clean-room inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify the complete v10 to v20 patch chain
        shell: bash
        env:
          WRAPPING_KEY_B64: ${{ secrets.PAYLOAD_KEY_B64 }}
        run: bash scripts/aspire-v20-patch-chain-gate.sh
