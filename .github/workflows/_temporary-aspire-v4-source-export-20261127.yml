name: Export verified Aspire v4 YARP source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_temporary-aspire-v4-source-export-20261127.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout sealed inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Decrypt and verify v4 overlay
        shell: bash
        env:
          WRAPPING_KEY_B64: ${{ secrets.PAYLOAD_KEY_B64 }}
        run: |
          set -euo pipefail
          meta_get() {
            awk -F= -v key="$1" '$1 == key { print substr($0, index($0, "=") + 1); exit }' sealed/aspire-macos-matrix-v4-overlay.metadata
          }
          printf '%s' "$WRAPPING_KEY_B64" | openssl base64 -d -A > wrapping.key
          test "$(wc -c < wrapping.key | tr -d ' ')" = "32"
          WRAP_HEX="$(od -An -tx1 -v wrapping.key | tr -d ' \n')"
          openssl enc -d -aes-256-cbc -K "$WRAP_HEX" \
            -iv "$(tr -d '\r\n ' < bootstrap/private.iv.hex)" \
            -in bootstrap/private.pem.enc -out private.pem

          tr -d '\r\n ' < sealed/aspire-macos-matrix-v4-overlay.key.enc.b64 | openssl base64 -d -A > overlay.key.enc
          test "$(sha256sum overlay.key.enc | awk '{print $1}')" = "$(meta_get OVERLAY_KEY_CIPHER_SHA256)"
          openssl pkeyutl -decrypt -inkey private.pem -in overlay.key.enc -out overlay.key \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256
          test "$(wc -c < overlay.key | tr -d ' ')" = "32"

          cat sealed/aspire-macos-matrix-v4-overlay.enc.b64.part-* | tr -d '\r\n ' > overlay.enc.b64
          openssl base64 -d -A -in overlay.enc.b64 -out overlay.enc
          test "$(sha256sum overlay.enc | awk '{print $1}')" = "$(meta_get OVERLAY_CIPHER_SHA256)"
          KEY_HEX="$(od -An -tx1 -v overlay.key | tr -d ' \n')"
          openssl enc -d -aes-256-cbc -K "$KEY_HEX" -iv "$(meta_get OVERLAY_IV_HEX)" \
            -in overlay.enc -out overlay.zip
          test "$(sha256sum overlay.zip | awk '{print $1}')" = "$(meta_get OVERLAY_PLAIN_SHA256)"
          mkdir verified-v4-source
          unzip -q overlay.zip -d extracted
          cp extracted/aspire-macos-matrix-v4/run.sh verified-v4-source/run.sh
          cp extracted/aspire-macos-matrix-v4/browser.js verified-v4-source/browser.js
          test "$(sha256sum verified-v4-source/run.sh | awk '{print $1}')" = "$(meta_get RUN_SH_SHA256)"
          test "$(sha256sum verified-v4-source/browser.js | awk '{print $1}')" = "$(meta_get BROWSER_JS_SHA256)"
          cp sealed/aspire-macos-matrix-v4-overlay.metadata verified-v4-source/SOURCE_METADATA.txt
          sha256sum verified-v4-source/* > verified-v4-source/SHA256SUMS.txt
          rm -rf wrapping.key private.pem overlay.key.enc overlay.key overlay.enc.b64 overlay.enc overlay.zip extracted

      - name: Upload verified v4 source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aspire-v4-verified-yarp-source
          path: verified-v4-source
          if-no-files-found: error
          retention-days: 3
          compression-level: 6
