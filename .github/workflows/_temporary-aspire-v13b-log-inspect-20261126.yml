name: Export sanitized Aspire v13b AppHost diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_temporary-aspire-v13b-log-inspect-20261126.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Decrypt and print redacted AppHost diagnostics
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WRAPPING_KEY_B64: ${{ secrets.PAYLOAD_KEY_B64 }}
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/zerodaybugs/runner-cleanroom-20261114-7f3c9a/actions/artifacts/15130728985/zip -o artifact.zip
          test "$(sha256sum artifact.zip | awk '{print $1}')" = "54decf88e7e0f7972591bbf6b46b4fbaeda1a7ee633d2d01c9ae5b4cd02fd897"
          mkdir artifact evidence
          unzip -q artifact.zip -d artifact
          printf '%s' "$WRAPPING_KEY_B64" | openssl base64 -d -A > wrapping.key
          test "$(wc -c < wrapping.key | tr -d ' ')" = "32"
          WRAP_KEY_HEX="$(od -An -tx1 -v wrapping.key | tr -d ' \n')"
          openssl enc -d -aes-256-cbc -K "$WRAP_KEY_HEX" -iv "$(tr -d '\r\n ' < bootstrap/private.iv.hex)" -in bootstrap/private.pem.enc -out private.pem
          tr -d '\r\n ' < sealed/aspire-macos-matrix-v2.key.enc.b64 | openssl base64 -d -A > payload.key.enc
          openssl pkeyutl -decrypt -inkey private.pem -in payload.key.enc -out runtime.key -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256
          KEY_HEX="$(od -An -tx1 -v runtime.key | tr -d ' \n')"
          openssl enc -d -aes-256-cbc -K "$KEY_HEX" -iv "$(tr -d '\r\n ' < artifact/evidence.iv.hex)" -in artifact/evidence.enc -out evidence.zip
          test "$(sha256sum evidence.zip | awk '{print $1}')" = "$(tr -d '\r\n ' < artifact/evidence.plain.sha256)"
          unzip -q evidence.zip -d evidence
          ROOT="$(find evidence -mindepth 1 -maxdepth 1 -type d | head -1)"
          test -n "$ROOT"
          redact() { python3 -c 'import re,sys; s=sys.stdin.read(); s=re.sub(r"https?://localhost:[0-9]+/login\\?t=[-A-Za-z0-9_]+","<LOGIN_URL_REDACTED>",s); s=re.sub(r"(?i)(authorization|cookie|token)[=: ]+\\S+",r"\\1=<REDACTED>",s); print(s[-30000:])'; }
          for lane in first_patched_13_6_5_legacy current_17_0_0_legacy current_17_0_0_legacy_natural_fix current_17_0_0_legacy_revert_stock; do
            echo "=== $lane apphost.log tail ==="
            tail -260 "$ROOT/$lane/apphost.log" 2>/dev/null | redact || true
            echo "=== $lane docker ps ==="
            tail -120 "$ROOT/$lane/docker-ps-a.txt" 2>/dev/null | redact || true
            echo "=== $lane DCP status ==="
            cat "$ROOT/$lane/dcp-status.txt" 2>/dev/null || true
          done
          echo '=== bootstrap trace filtered ==='
          grep -E -i 'error|exception|disconnect|connection|resource|dashboard|dcp|failed|timeout' "$ROOT/bootstrap-trace.log" 2>/dev/null | tail -500 | redact || true
          rm -rf artifact evidence artifact.zip evidence.zip wrapping.key private.pem payload.key.enc runtime.key