name: Gate sealed Aspire v21 patch chain
# trigger: v21-chain-r3-standalone

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_temporary-aspire-v21-patch-chain-gate-20261127.yml'
      - 'scripts/aspire-v21-patch-chain-gate.sh'
      - 'scripts/aspire-v21-apply.sh'
      - 'sealed/aspire-v21-natural-discovery-patcher.metadata'
      - 'sealed/aspire-v21-natural-discovery-patcher.key.enc.b64'
      - 'sealed/aspire-v21-natural-discovery-patcher.enc.b64.part-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-chain-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout sealed clean-room inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Reconstruct and verify full v13-v21 chain
        shell: bash
        env:
          WRAPPING_KEY_B64: ${{ secrets.PAYLOAD_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "$WRAPPING_KEY_B64"
          test "$(sha256sum scripts/aspire-v21-patch-chain-gate.sh | awk '{print $1}')" = \
            '23cddc2f2325d35af55fcc80f54a25101ea7269a62af82a11319f570679ef9a9'
          test "$(sha256sum scripts/aspire-v21-apply.sh | awk '{print $1}')" = \
            '22051d15451929bb6f28a2efd491978c3855d24dfcd62881aef023fdf56c0b9b'
          bash -n scripts/aspire-v21-patch-chain-gate.sh
          bash -n scripts/aspire-v21-apply.sh
          chmod 700 scripts/aspire-v21-patch-chain-gate.sh scripts/aspire-v21-apply.sh
          scripts/aspire-v21-patch-chain-gate.sh
