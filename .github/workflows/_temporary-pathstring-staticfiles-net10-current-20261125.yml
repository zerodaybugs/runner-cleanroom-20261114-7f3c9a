name: Sealed PathString StaticFiles .NET 10.0.15 residual validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_temporary-pathstring-staticfiles-net10-current-20261125.yml'
  workflow_dispatch:

permissions:
  contents: read
jobs:
  exact-ga-windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout encrypted clean-room inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install exact .NET 10.0.404 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.404
          cache: false

      - name: Unwrap, retarget, and execute private PathString probe
        id: execute
        continue-on-error: true
        shell: pwsh
        env:
          WRAPPING_KEY_B64: ${{ secrets.PAYLOAD_KEY_B64 }}
          DOTNET_NOLOGO: '1'
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_ROLL_FORWARD: LatestPatch
          DOTNET_ROLL_FORWARD_TO_PRERELEASE: '0'
          DOTNET_MULTILEVEL_LOOKUP: '0'
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:WRAPPING_KEY_B64)) { throw 'wrapping key missing' }

          $wrappingKey = [Convert]::FromBase64String($env:WRAPPING_KEY_B64)
          if ($wrappingKey.Length -ne 32) { throw 'wrapping key length invalid' }
          $wrappedPrivate = [IO.File]::ReadAllBytes((Join-Path $PWD 'bootstrap/private.pem.enc'))
          $wrapIv = [Convert]::FromHexString((Get-Content -LiteralPath (Join-Path $PWD 'bootstrap/private.iv.hex') -Raw).Trim())
          $aes = [Security.Cryptography.Aes]::Create()
          try {
            $aes.Mode = [Security.Cryptography.CipherMode]::CBC
            $aes.Padding = [Security.Cryptography.PaddingMode]::PKCS7
            $aes.Key = $wrappingKey
            $aes.IV = $wrapIv
            $decryptor = $aes.CreateDecryptor()
            try { $privatePemBytes = $decryptor.TransformFinalBlock($wrappedPrivate, 0, $wrappedPrivate.Length) }
            finally { $decryptor.Dispose() }
          } finally { $aes.Dispose() }

          $rsa = [Security.Cryptography.RSA]::Create()
          try {
            $rsa.ImportFromPem([Text.Encoding]::ASCII.GetString($privatePemBytes))
            $wrappedPayloadKey = [Convert]::FromBase64String((Get-Content -LiteralPath (Join-Path $PWD 'payloads/pathstring-staticfiles-win-v1.key.enc.b64') -Raw).Trim())
            $payloadKey = $rsa.Decrypt($wrappedPayloadKey, [Security.Cryptography.RSAEncryptionPadding]::OaepSHA256)
          } finally { $rsa.Dispose() }
          if ($payloadKey.Length -ne 32) { throw 'payload key length invalid' }
          [IO.File]::WriteAllBytes((Join-Path $PWD 'pathstring-staticfiles.runtime.key'), $payloadKey)

          $payloadIv = [Convert]::FromHexString((Get-Content -LiteralPath (Join-Path $PWD 'payloads/pathstring-staticfiles-win-v2.iv.hex') -Raw).Trim())
          $payloadCipherB64 = ((Get-ChildItem -LiteralPath (Join-Path $PWD 'payloads') -File -Filter 'pathstring-staticfiles-win-v2.enc.part*' | Sort-Object Name | ForEach-Object { (Get-Content -LiteralPath $_.FullName -Raw).Trim() }) -join '')
          $payloadCipher = [Convert]::FromBase64String($payloadCipherB64)
          $aes = [Security.Cryptography.Aes]::Create()
          try {
            $aes.Mode = [Security.Cryptography.CipherMode]::CBC
            $aes.Padding = [Security.Cryptography.PaddingMode]::PKCS7
            $aes.Key = $payloadKey
            $aes.IV = $payloadIv
            $decryptor = $aes.CreateDecryptor()
            try { $payloadPlain = $decryptor.TransformFinalBlock($payloadCipher, 0, $payloadCipher.Length) }
            finally { $decryptor.Dispose() }
          } finally { $aes.Dispose() }

          $payloadZip = Join-Path $PWD 'pathstring-staticfiles.payload.zip'
          [IO.File]::WriteAllBytes($payloadZip, $payloadPlain)
          $expectedHash = (Get-Content -LiteralPath (Join-Path $PWD 'payloads/pathstring-staticfiles-win-v2.plain.sha256') -Raw).Trim().ToLowerInvariant()
          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $payloadZip).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) { throw "payload hash mismatch: $actualHash" }

          $payloadDir = Join-Path $PWD 'pathstring-staticfiles-payload'
          Expand-Archive -LiteralPath $payloadZip -DestinationPath $payloadDir -Force
          $root = Join-Path $payloadDir 'zdb-pathstring-win-payload'
          Get-ChildItem -LiteralPath $root -Recurse -File -Include '*.csproj','*.props','*.targets','*.ps1' | ForEach-Object {
            $text = Get-Content -LiteralPath $_.FullName -Raw
            $text = $text.Replace('net11.0','net10.0').Replace('11.0.100','10.0.404').Replace('.NET 11.0.0','.NET 10.0.15').Replace('11.0.0.0','10.0.0.0')
            Set-Content -LiteralPath $_.FullName -Value $text -NoNewline -Encoding utf8
          }
          $globalJson = [ordered]@{
            sdk = [ordered]@{
              version = '10.0.404'
              rollForward = 'disable'
              allowPrerelease = $false
            }
          } | ConvertTo-Json -Depth 5
          Set-Content -LiteralPath (Join-Path $root 'global.json') -Value $globalJson -Encoding utf8NoBOM

          Push-Location $root
          try {
            $actualSdk = (& dotnet --version).Trim()
            if ($actualSdk -ne '10.0.404') { throw "SDK mismatch: $actualSdk" }
            $runtimeRows = @(& dotnet --list-runtimes)
            if (-not ($runtimeRows -match '^Microsoft.NETCore.App 10\.0\.15 \[')) { throw 'Microsoft.NETCore.App 10.0.15 missing' }
            if (-not ($runtimeRows -match '^Microsoft.AspNetCore.App 10\.0\.15 \[')) { throw 'Microsoft.AspNetCore.App 10.0.15 missing' }
            & pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $root 'run.ps1')
            if ($LASTEXITCODE -ne 0) { throw "probe failed: $LASTEXITCODE" }
          } finally {
            Pop-Location
          }

      - name: Seal evidence
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $keyPath = Join-Path $PWD 'pathstring-staticfiles.runtime.key'
          $dirs = @(Get-ChildItem -LiteralPath $PWD -Directory -Filter 'evidence-pathstring-staticfiles*')
          if ($dirs.Count -eq 0) {
            $fallback = Join-Path $PWD 'evidence-pathstring-staticfiles-fallback'
            New-Item -ItemType Directory -Force -Path $fallback | Out-Null
            'NO_EVIDENCE_DIRECTORY' | Set-Content (Join-Path $fallback 'status.txt')
            $dirs = @((Get-Item -LiteralPath $fallback))
          }
          if (-not (Test-Path -LiteralPath $keyPath)) { throw 'payload evidence key unavailable' }
          $zipPath = Join-Path $PWD 'pathstring-net10-evidence.plain.zip'
          Compress-Archive -Path $dirs.FullName -DestinationPath $zipPath -Force
          $plainHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zipPath).Hash.ToLowerInvariant()
          $payloadKey = [IO.File]::ReadAllBytes($keyPath)
          $evidenceIv = [Security.Cryptography.RandomNumberGenerator]::GetBytes(16)
          $plain = [IO.File]::ReadAllBytes($zipPath)
          $aes = [Security.Cryptography.Aes]::Create()
          try {
            $aes.Mode = [Security.Cryptography.CipherMode]::CBC
            $aes.Padding = [Security.Cryptography.PaddingMode]::PKCS7
            $aes.Key = $payloadKey
            $aes.IV = $evidenceIv
            $encryptor = $aes.CreateEncryptor()
            try { $cipher = $encryptor.TransformFinalBlock($plain, 0, $plain.Length) }
            finally { $encryptor.Dispose() }
          } finally { $aes.Dispose() }
          $sealed = Join-Path $PWD 'sealed-evidence'
          New-Item -ItemType Directory -Force -Path $sealed | Out-Null
          $cipherPath = Join-Path $sealed 'evidence.enc'
          [IO.File]::WriteAllBytes($cipherPath, $cipher)
          [Convert]::ToHexString($evidenceIv).ToLowerInvariant() | Set-Content (Join-Path $sealed 'evidence.iv.hex') -Encoding ascii
          $plainHash | Set-Content (Join-Path $sealed 'evidence.plain.sha256') -Encoding ascii
          (Get-FileHash -Algorithm SHA256 -LiteralPath $cipherPath).Hash.ToLowerInvariant() | Set-Content (Join-Path $sealed 'evidence.cipher.sha256') -Encoding ascii
          @(
            'FORMAT=ZDB-AES-256-CBC-PKCS7-V1',
            'TARGET=ASP.NET Core 10.0.15 exact-GA Windows PathString-to-StaticFiles residual',
            'RUNNER=${{ matrix.os }}',
            'RUN_ID=${{ github.run_id }}',
            'SOURCE_SHA=${{ github.sha }}',
            'EXECUTE_OUTCOME=${{ steps.execute.outcome }}'
          ) | Set-Content (Join-Path $sealed 'metadata.txt') -Encoding ascii
          Remove-Item -LiteralPath $zipPath,$keyPath -Force -ErrorAction SilentlyContinue
          foreach ($candidate in @(
            (Join-Path $PWD 'pathstring-staticfiles.payload.zip'),
            (Join-Path $PWD 'pathstring-staticfiles-payload')
          )) {
            if (Test-Path -LiteralPath $candidate) {
              Remove-Item -LiteralPath $candidate -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          foreach ($dir in $dirs) {
            if (Test-Path -LiteralPath $dir.FullName) {
              Remove-Item -LiteralPath $dir.FullName -Recurse -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Upload sealed evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pathstring-staticfiles-net10-${{ matrix.os }}-${{ github.sha }}
          path: sealed-evidence
          if-no-files-found: error
          retention-days: 3

      - name: Enforce probe result
        if: always()
        shell: pwsh
        run: |
          if ('${{ steps.execute.outcome }}' -ne 'success') {
            throw 'The exact-GA .NET 10 residual probe did not satisfy all controls; inspect sealed evidence.'
          }
