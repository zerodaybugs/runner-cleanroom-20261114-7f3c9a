name: Audit sealed Aspire v19-v20 patch contracts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_temporary-aspire-v20-patch-contract-audit-20261127.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout sealed clean-room inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify, decrypt, and inspect patch contracts
        shell: bash
        env:
          WRAPPING_KEY_B64: ${{ secrets.PAYLOAD_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "$WRAPPING_KEY_B64"

          meta_get() {
            local file="$1" key="$2"
            awk -F= -v key="$key" '$1 == key { print substr($0, index($0, "=") + 1); exit }' "$file"
          }

          printf '%s' "$WRAPPING_KEY_B64" | openssl base64 -d -A > wrapping.key
          test "$(wc -c < wrapping.key | tr -d ' ')" = 32
          WRAP_KEY_HEX="$(od -An -tx1 -v wrapping.key | tr -d ' \n')"
          openssl enc -d -aes-256-cbc -K "$WRAP_KEY_HEX" \
            -iv "$(tr -d '\r\n ' < bootstrap/private.iv.hex)" \
            -in bootstrap/private.pem.enc -out private.pem

          decrypt_bundle() {
            local label="$1" meta="$2" b64glob="$3" keyfile="$4" outzip="$5"
            cat $b64glob | tr -d '\r\n ' > "$label.enc.b64.norm"
            test "$(sha256sum "$label.enc.b64.norm" | awk '{print $1}')" = "$(meta_get "$meta" PATCH_B64_NORMALIZED_SHA256)"
            openssl base64 -d -A -in "$label.enc.b64.norm" -out "$label.enc"
            test "$(sha256sum "$label.enc" | awk '{print $1}')" = "$(meta_get "$meta" PATCH_CIPHER_SHA256)"
            tr -d '\r\n ' < "$keyfile" | openssl base64 -d -A > "$label.key.enc"
            test "$(sha256sum "$label.key.enc" | awk '{print $1}')" = "$(meta_get "$meta" PATCH_KEY_CIPHER_SHA256)"
            openssl pkeyutl -decrypt -inkey private.pem -in "$label.key.enc" -out "$label.key" \
              -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256
            test "$(wc -c < "$label.key" | tr -d ' ')" = 32
            local key_hex
            key_hex="$(od -An -tx1 -v "$label.key" | tr -d ' \n')"
            openssl enc -d -aes-256-cbc -K "$key_hex" -iv "$(meta_get "$meta" PATCH_IV_HEX)" \
              -in "$label.enc" -out "$outzip"
            test "$(sha256sum "$outzip" | awk '{print $1}')" = "$(meta_get "$meta" PATCH_PLAIN_SHA256)"
          }

          decrypt_bundle v19 sealed/aspire-v19-patches.metadata \
            'sealed/aspire-v19-patches.enc.b64' \
            sealed/aspire-v19-patches.key.enc.b64 v19.zip
          decrypt_bundle v20 sealed/aspire-v20-trusted-yarp-patcher.metadata \
            'sealed/aspire-v20-trusted-yarp-patcher.enc.b64.part-*' \
            sealed/aspire-v20-trusted-yarp-patcher.key.enc.b64 v20.zip

          echo '=== V19 MEMBERS ==='
          unzip -Z1 v19.zip | sort
          echo '=== V20 MEMBERS ==='
          unzip -Z1 v20.zip | sort
          mkdir -p audit/v19 audit/v20
          unzip -q v19.zip -d audit/v19
          unzip -q v20.zip -d audit/v20

          find audit -type f -print0 | sort -z | xargs -0 sha256sum
          find audit -type f -name '*.py' -print0 | xargs -0 -n1 python3 -m py_compile

          python3 - <<'PY'
          import ast, hashlib, json
          from pathlib import Path

          def dotted(node):
              if isinstance(node, ast.Name):
                  return node.id
              if isinstance(node, ast.Attribute):
                  left = dotted(node.value)
                  return f"{left}.{node.attr}" if left else node.attr
              return None

          rows=[]
          for path in sorted(Path('audit').rglob('*.py')):
              text=path.read_text(encoding='utf-8')
              tree=ast.parse(text, filename=str(path))
              argv_indices=set()
              add_arguments=[]
              functions=[]
              for node in ast.walk(tree):
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      functions.append({
                          'name': node.name,
                          'positional': [a.arg for a in node.args.args],
                          'requiredPositional': max(0, len(node.args.args)-len(node.args.defaults)),
                      })
                  if isinstance(node, ast.Subscript) and dotted(node.value) == 'sys.argv':
                      sl=node.slice
                      if isinstance(sl, ast.Constant) and isinstance(sl.value, int):
                          argv_indices.add(sl.value)
                  if isinstance(node, ast.Call) and dotted(node.func) and dotted(node.func).endswith('.add_argument'):
                      names=[]
                      for arg in node.args:
                          if isinstance(arg, ast.Constant) and isinstance(arg.value, str):
                              names.append(arg.value)
                      add_arguments.append(names)
              rows.append({
                  'path': str(path),
                  'sha256': hashlib.sha256(text.encode()).hexdigest(),
                  'sysArgvIndices': sorted(argv_indices),
                  'argparseNames': add_arguments,
                  'functions': functions,
              })
          print('=== PYTHON CONTRACTS ===')
          print(json.dumps(rows, indent=2, sort_keys=True))
          PY

          rm -rf wrapping.key private.pem v19.enc.b64.norm v19.enc v19.key.enc v19.key \
            v20.enc.b64.norm v20.enc v20.key.enc v20.key v19.zip v20.zip audit
          echo PATCH_CONTRACT_AUDIT=PASS
