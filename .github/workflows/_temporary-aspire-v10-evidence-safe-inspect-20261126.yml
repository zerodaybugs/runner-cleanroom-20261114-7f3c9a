name: Inspect sealed Aspire v10 evidence safely

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_temporary-aspire-v10-evidence-safe-inspect-20261126.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout sealed inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Decrypt and emit non-sensitive diagnostics
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WRAPPING_KEY_B64: ${{ secrets.PAYLOAD_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "$WRAPPING_KEY_B64"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/zerodaybugs/runner-cleanroom-20261114-7f3c9a/actions/artifacts/15074031521/zip -o artifact.zip
          test "$(sha256sum artifact.zip | awk '{print $1}')" = "c4cc569684c869196e6a0edab6b361165263f73676ec3a2eaeaa8179f8f134aa"
          mkdir artifact evidence
          unzip -q artifact.zip -d artifact

          printf '%s' "$WRAPPING_KEY_B64" | openssl base64 -d -A > wrapping.key
          test "$(wc -c < wrapping.key | tr -d ' ')" = "32"
          WRAP_KEY_HEX="$(od -An -tx1 -v wrapping.key | tr -d ' \n')"
          openssl enc -d -aes-256-cbc -K "$WRAP_KEY_HEX" -iv "$(tr -d '\r\n ' < bootstrap/private.iv.hex)" \
            -in bootstrap/private.pem.enc -out private.pem
          tr -d '\r\n ' < sealed/aspire-macos-matrix-v2.key.enc.b64 | openssl base64 -d -A > payload.key.enc
          openssl pkeyutl -decrypt -inkey private.pem -in payload.key.enc -out runtime.key \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256
          test "$(wc -c < runtime.key | tr -d ' ')" = "32"

          test "$(sha256sum artifact/evidence.enc | awk '{print $1}')" = "$(tr -d '\r\n ' < artifact/evidence.cipher.sha256)"
          KEY_HEX="$(od -An -tx1 -v runtime.key | tr -d ' \n')"
          openssl enc -d -aes-256-cbc -K "$KEY_HEX" -iv "$(tr -d '\r\n ' < artifact/evidence.iv.hex)" \
            -in artifact/evidence.enc -out evidence.zip
          test "$(sha256sum evidence.zip | awk '{print $1}')" = "$(tr -d '\r\n ' < artifact/evidence.plain.sha256)"
          unzip -q evidence.zip -d evidence
          ROOT="$(find evidence -mindepth 1 -maxdepth 1 -type d | head -1)"
          test -n "$ROOT"

          echo '=== WORKFLOW STATUS ==='
          cat "$ROOT/workflow-status.txt" 2>/dev/null || true
          cat "$ROOT/bootstrap-status.txt" 2>/dev/null || true
          echo '=== MATRIX SUMMARY SANITIZED ==='
          python3 - "$ROOT/matrix-summary.json" <<'PY'
          import json,sys
          try: rows=json.load(open(sys.argv[1]))
          except Exception as e: print(type(e).__name__,e); raise SystemExit(0)
          for row in rows:
              b=row.get('browser-result.json') or {}
              d=row.get('dcp-scope-assertion.json') or {}
              keep=['lane','aspireVersion','mode','dashboardConnected','linkedServiceOpened','cookieLeak','replayAuthenticated','commandExecuted','errorStage','errorClass','errorMessage','replayError','replayTitle','cookieHeaderBytes','captureMeta']
              print(json.dumps({'lane':row.get('lane'),'status':row.get('status'),'assertion':row.get('assertion'),'browser':{k:b.get(k) for k in keep if k in b},'dcpExpected':d.get('expected'),'dcpPass':d.get('pass'),'dashboardServices':d.get('dashboardServices')},sort_keys=True))
          PY
          echo '=== LANE ASSERTIONS ==='
          find "$ROOT" -mindepth 2 -maxdepth 2 -type f \( -name status.txt -o -name assertion.txt -o -name readiness.txt -o -name dcp-scope-assertion.json \) -print0 | sort -z | while IFS= read -r -d '' f; do
            echo "--- ${f#$ROOT/}"
            sed -n '1,220p' "$f"
          done
          echo '=== BROWSER RESULTS ==='
          find "$ROOT" -mindepth 2 -maxdepth 2 -type f -name browser-result.json -print0 | sort -z | while IFS= read -r -d '' f; do
            echo "--- ${f#$ROOT/}"
            python3 - "$f" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1]))
          keep=['lane','aspireVersion','mode','dashboardConnected','linkedServiceOpened','cookieLeak','replayAuthenticated','commandExecuted','errorStage','errorClass','errorMessage','replayError','replayTitle','cookieHeaderBytes','dashboardLinks','captureMeta']
          print(json.dumps({k:j.get(k) for k in keep if k in j},indent=2,sort_keys=True))
          PY
          done
          echo '=== ATTACKER/CAPTURE DIAGNOSTICS ==='
          find "$ROOT" -mindepth 2 -maxdepth 2 -type f \( -name 'capture-meta.json' -o -name 'attacker-container-inspect.json' -o -name 'docker-ps-a.txt' -o -name 'browser.stderr' -o -name 'apphost-tail.txt' \) -print0 | sort -z | while IFS= read -r -d '' f; do
            echo "--- ${f#$ROOT/}"
            if [[ "$f" == *attacker-container-inspect.json ]]; then
              python3 - "$f" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1])); x=j[0] if isinstance(j,list) else j
          print(json.dumps({'Config':{k:(x.get('Config') or {}).get(k) for k in ['Image','Cmd','Entrypoint','Env']},'State':x.get('State'),'NetworkSettings':x.get('NetworkSettings')},indent=2,sort_keys=True)[:24000])
          PY
            else
              tail -220 "$f"
            fi
          done
          echo '=== FIX CONTROL ==='
          for f in "$ROOT/natural_fix_control/status.txt" "$ROOT/natural_fix_control/fix-dll.sha256" "$ROOT/natural_fix_control/natural-fix.patch" "$ROOT/natural_fix_control/revert-status.txt"; do
            [[ -f "$f" ]] && { echo "--- ${f#$ROOT/}"; sed -n '1,260p' "$f"; }
          done
          echo '=== BOOTSTRAP TRACE TAIL ==='
          tail -320 "$ROOT/bootstrap-trace.log" 2>/dev/null || true

          rm -rf artifact evidence artifact.zip evidence.zip wrapping.key private.pem payload.key.enc runtime.key
