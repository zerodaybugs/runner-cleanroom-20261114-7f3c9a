name: Aspire v24 live Dashboard startup diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_temporary-aspire-v22-fifo-smoke-20261128.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-startup-diagnostics:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout sealed inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install exact .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.404
          cache: false

      - name: Install software-virtualized container runtime
        shell: bash
        run: |
          set -euo pipefail
          brew install docker qemu colima
          colima start --vm-type qemu --arch aarch64 --cpu 3 --memory 6 --disk 30 --runtime docker
          colima status
          docker version

      - name: Execute exact current lane and capture live diagnostics
        id: diagnose
        shell: bash
        env:
          WRAPPING_KEY_B64: ${{ secrets.PAYLOAD_KEY_B64 }}
        run: |
          set -euo pipefail
          umask 077
          RAW=diagnostic-raw
          SAFE=diagnostic-safe
          mkdir -p "$RAW" "$SAFE"

          test "$(shasum -a 256 scripts/aspire-v21-noninteractive-cert-harness.py | awk '{print $1}')" = \
            'b290de46fe9a6eeb2bc78970e1689b2fabb5b241e353925dbe53bd79396da43d'
          test "$(shasum -a 256 scripts/aspire-v22-fifo-cli-harness.py | awk '{print $1}')" = \
            '57fed824243c643374ca391f58311d94c65d770a0928f08f5b7c9c0905d31f3e'
          python3 -m py_compile scripts/aspire-v21-noninteractive-cert-harness.py scripts/aspire-v22-fifo-cli-harness.py

          cp scripts/aspire-v20-patch-chain-gate.sh /tmp/aspire-v24-reconstruct.sh
          python3 - /tmp/aspire-v24-reconstruct.sh <<'PY_KEEP'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text(); old='trap cleanup EXIT\n'
          if s.count(old)!=1: raise SystemExit(f'cleanup trap count={s.count(old)}')
          p.write_text(s.replace(old,'# cleanup deferred for exact diagnostic execution\n',1))
          PY_KEEP
          chmod 700 /tmp/aspire-v24-reconstruct.sh
          /tmp/aspire-v24-reconstruct.sh

          RUN=patched-v13/run.sh
          BROWSER=patched-v13/browser.js
          test "$(shasum -a 256 "$RUN" | awk '{print $1}')" = '55c6470e32a2ed5602ff0a450a587966ad6f40b9a5b88eb7a4d3514edf235906'
          test "$(shasum -a 256 "$BROWSER" | awk '{print $1}')" = 'e9e33b5ef3a3f3f08779af526bd91fa633f0f52f2f4676d51eb8add2c4eeefbe'
          python3 scripts/aspire-v21-noninteractive-cert-harness.py "$RUN" "$RAW/v21-cert-receipt.json" >/dev/null
          test "$(shasum -a 256 "$RUN" | awk '{print $1}')" = '1f3057ecc1dfe1e30affa959c06788447ac9844701f936288292b7e3ac359150'
          python3 scripts/aspire-v22-fifo-cli-harness.py "$RUN" "$RAW/v22-fifo-receipt.json" >/dev/null
          test "$(shasum -a 256 "$RUN" | awk '{print $1}')" = '7979c6301c1b012c165121fe0a496794b700e6e35f49a8b37abd459667196c41'
          bash -n "$RUN"
          node --check "$BROWSER"

          cp "$RUN" smoke-run.sh
          python3 - smoke-run.sh <<'PY_ONE_LANE'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text()
          start_marker='matrix_rc=0\n# Independent residual replication: only the mandatory first-patched/current/fix/revert lanes.\n'
          final_marker='cleanup_lane "$WORK/"\nexit "$matrix_rc"\n'
          if s.count(start_marker)!=1: raise SystemExit(f'matrix start count={s.count(start_marker)}')
          if s.count(final_marker)<1: raise SystemExit('matrix final marker missing')
          start=s.index(start_marker)
          end=s.rindex(final_marker)+len(final_marker)
          replacement='''matrix_rc=0
          run_lane current_17_0_0_legacy 17.0.0 legacy 18600 positive frontend-exposed "" "" 10.0.404 net10.0 || matrix_rc=1
          exit "$matrix_rc"
          '''
          p.write_text(s[:start]+replacement+s[end:])
          PY_ONE_LANE
          bash -n smoke-run.sh

          set +e
          bash smoke-run.sh
          RC=$?
          set -e
          printf 'SMOKE_RC=%s\n' "$RC" > "$RAW/smoke-status.txt"
          printf 'RUN_SHA256=%s\nBROWSER_SHA256=%s\n' \
            "$(shasum -a 256 "$RUN" | awk '{print $1}')" \
            "$(shasum -a 256 "$BROWSER" | awk '{print $1}')" > "$RAW/harness-hashes.txt"

          LANE=evidence-aspire120006-macos-v20-trusted-yarp/current_17_0_0_legacy
          APP=zdb-matrix-work/current_17_0_0_legacy/AppHost
          mkdir -p "$RAW/lane" "$RAW/project" "$RAW/runtime"

          if [[ -d "$LANE" ]]; then
            find "$LANE" -maxdepth 2 -type f -print0 | while IFS= read -r -d '' f; do
              case "$(basename "$f")" in
                status.txt|assertion.txt|readiness.txt|login-token-shape.json|post-browser-health.json|browser-result.json|browser.stdout|browser.stderr|apphost.log|apphost-tail.txt|build.log|dotnet-lane.txt|dcp-status.txt|dcp-dashboard-services.json|dcp-scope-assertion.json|capture-meta.json|framework-lane.txt|apphost.pid|devcert-gate.txt|container-ca-load.txt|yarp-tls-handshake.txt)
                  cp "$f" "$RAW/lane/$(basename "$f")" 2>/dev/null || true
                  ;;
              esac
            done
          fi

          for f in "$APP/AppHost.cs" "$APP/AppHost.csproj" "$APP/Properties/launchSettings.json" "$APP/appsettings.json" "zdb-matrix-work/current_17_0_0_legacy/global.json" "$APP/aspire.config.json"; do
            [[ -f "$f" ]] && cp "$f" "$RAW/project/$(basename "$f")"
          done

          ps -axww -o pid=,ppid=,pgid=,state=,etime=,command= > "$RAW/runtime/processes.txt" || true
          pgrep -afil 'aspire|dcp|dashboard|apphost|dotnet' > "$RAW/runtime/relevant-processes.txt" || true
          lsof -nP -iTCP -sTCP:LISTEN > "$RAW/runtime/listeners.txt" 2>&1 || true
          netstat -anv -p tcp > "$RAW/runtime/netstat-tcp.txt" 2>&1 || true
          docker ps -a --no-trunc --format '{{json .}}' > "$RAW/runtime/docker-ps.jsonl" 2>&1 || true
          docker network ls --format '{{json .}}' > "$RAW/runtime/docker-networks.jsonl" 2>&1 || true
          docker inspect $(docker ps -aq) --format '{{json .Name}} {{json .Config.Image}} {{json .State.Status}} {{json .NetworkSettings.Ports}} {{json .NetworkSettings.Networks}}' > "$RAW/runtime/docker-inspect-safe.txt" 2>&1 || true

          APPHOST_PID=''
          [[ -f "$LANE/apphost.pid" ]] && APPHOST_PID="$(tr -dc '0-9' < "$LANE/apphost.pid")"
          if [[ -n "$APPHOST_PID" ]] && kill -0 "$APPHOST_PID" 2>/dev/null; then
            ps -p "$APPHOST_PID" -o pid=,ppid=,pgid=,state=,etime=,command= > "$RAW/runtime/apphost-process.txt" || true
            lsof -nP -p "$APPHOST_PID" > "$RAW/runtime/apphost-open-files.txt" 2>&1 || true
            if command -v sample >/dev/null 2>&1; then
              sample "$APPHOST_PID" 1 1 -file "$RAW/runtime/apphost-sample.txt" >/dev/null 2>&1 || true
            fi
          else
            echo 'APPHOST_PROCESS_NOT_ALIVE' > "$RAW/runtime/apphost-process.txt"
          fi

          CERT="$(find zdb-matrix-work -type f -path '*trusted-devcert*' -name '*.crt' 2>/dev/null | head -1)"
          if [[ -n "$CERT" && -s "$CERT" ]]; then
            openssl x509 -in "$CERT" -noout -subject -issuer -serial -dates -fingerprint -sha256 > "$RAW/runtime/devcert-metadata.txt" 2>&1 || true
          fi

          : > "$RAW/runtime/port-probes.txt"
          for port in 18601 18602 18603 18604 18605 18606 18607 18608; do
            {
              echo "===== PORT $port ====="
              nc -vz 127.0.0.1 "$port" 2>&1 || true
              printf 'HTTPS_NORMAL='; curl -sS --connect-timeout 2 --max-time 4 -o /dev/null -w '%{http_code} %{remote_ip}:%{remote_port} %{ssl_verify_result}\n' "https://localhost:$port/" 2>&1 || true
              printf 'HTTPS_INSECURE='; curl -k -sS --connect-timeout 2 --max-time 4 -o /dev/null -w '%{http_code} %{remote_ip}:%{remote_port} %{ssl_verify_result}\n' "https://localhost:$port/" 2>&1 || true
              if [[ -n "$CERT" && -s "$CERT" ]]; then
                printf 'HTTPS_EXACT_CA='; curl --cacert "$CERT" -sS --connect-timeout 2 --max-time 4 -o /dev/null -w '%{http_code} %{remote_ip}:%{remote_port} %{ssl_verify_result}\n' "https://localhost:$port/" 2>&1 || true
              fi
              printf 'HTTP='; curl -sS --connect-timeout 2 --max-time 4 -o /dev/null -w '%{http_code} %{remote_ip}:%{remote_port}\n' "http://localhost:$port/" 2>&1 || true
              lsof -nP -iTCP:"$port" 2>&1 || true
            } >> "$RAW/runtime/port-probes.txt"
          done

          for port in 18601 18603 18604 18608; do
            if nc -z 127.0.0.1 "$port" >/dev/null 2>&1; then
              timeout 8 openssl s_client -connect "127.0.0.1:$port" -servername localhost -showcerts < /dev/null > "$RAW/runtime/tls-$port.txt" 2>&1 || true
            fi
          done

          {
            echo '=== TMPDIR ==='
            printf '%s\n' "${TMPDIR:-}"
            echo '=== relevant temporary files ==='
            find "${TMPDIR:-/tmp}" /tmp "$HOME/.aspire" -maxdepth 7 -type f 2>/dev/null | \
              grep -Ei 'aspire|dcp|dashboard|apphost|kubeconfig|log' | while IFS= read -r f; do
                printf '%12s %s %s\n' "$(stat -f '%z' "$f" 2>/dev/null || echo '?')" "$(stat -f '%Sm' -t '%Y-%m-%dT%H:%M:%S' "$f" 2>/dev/null || echo '?')" "$f"
              done
          } > "$RAW/runtime/relevant-file-inventory.txt" 2>&1 || true

          python3 - "$RAW" "$SAFE" <<'PY_SANITIZE'
          import hashlib, json, pathlib, re, shutil, sys
          raw, safe = map(pathlib.Path, sys.argv[1:])
          private_key = re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----.*?-----END (?:RSA |EC |OPENSSH )?PRIVATE KEY-----', re.I|re.S)
          substitutions = [
              (re.compile(r'([?&](?:t|token|access_token|code)=)[^&\s"\'<>]+', re.I), r'\1<REDACTED>'),
              (re.compile(r'(?im)^((?:authorization|proxy-authorization|cookie|set-cookie|x-api-key|x-otlp-api-key)\s*:\s*).+$'), r'\1<REDACTED>'),
              (re.compile(r'(?i)(ASPIRE_DASHBOARD_FRONTEND_BROWSERTOKEN=)[^\s"\']+'), r'\1<REDACTED>'),
              (re.compile(r'(?i)(\.Aspire\.Dashboard\.Auth[^=;\s"\']*=)[^;\s"\']+'), r'\1<REDACTED>'),
              (re.compile(r'(?i)((?:--server-key|--server-cert|--ca-cert|--browser-token|--token)\s+)(\S+)'), r'\1<REDACTED>'),
              (re.compile(r'(?im)^(\s*token\s*:\s*).+$'), r'\1<REDACTED>'),
              (re.compile(r'(?i)(PAYLOAD_KEY_B64|WRAPPING_KEY_B64)=\S+'), r'\1=<REDACTED>'),
          ]
          copied=[]; skipped=[]
          for src in sorted(raw.rglob('*')):
              if not src.is_file(): continue
              rel=src.relative_to(raw); data=src.read_bytes()
              if len(data)>16*1024*1024 or b'\x00' in data[:8192]:
                  skipped.append({'path':str(rel),'bytes':len(data),'reason':'binary-or-too-large'}); continue
              text=data.decode('utf-8','replace')
              text=private_key.sub('<PRIVATE_KEY_REDACTED>',text)
              for p,r in substitutions: text=p.sub(r,text)
              dst=safe/rel; dst.parent.mkdir(parents=True,exist_ok=True); dst.write_text(text)
              copied.append({'path':str(rel),'bytes':dst.stat().st_size,'sha256':hashlib.sha256(dst.read_bytes()).hexdigest()})
          report={'schema':1,'smokeRc':int(pathlib.Path(raw/'smoke-status.txt').read_text().split('=',1)[1]),'copied':copied,'skipped':skipped}
          (safe/'SANITIZE_REPORT.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          sums=[]
          for p in sorted(safe.rglob('*')):
              if p.is_file() and p.name!='SHA256SUMS.txt': sums.append(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(safe)}')
          (safe/'SHA256SUMS.txt').write_text('\n'.join(sums)+'\n')
          PY_SANITIZE

          if grep -RInaE --binary-files=without-match \
            'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|Authorization:[[:space:]]*(Bearer|Basic)[[:space:]]+[A-Za-z0-9._~+/=-]{12,}|Cookie:[[:space:]]*[^<]|Set-Cookie:[[:space:]]*[^<]|ASPIRE_DASHBOARD_FRONTEND_BROWSERTOKEN=[^<]|[?&](t|token|access_token|code)=[^<&[:space:]]+' "$SAFE"; then
            echo DIAGNOSTIC_SECRET_SCAN=FAIL >&2
            exit 91
          fi
          echo DIAGNOSTIC_SECRET_SCAN=PASS

          pkill -f 'dotnet run --no-build --launch-profile https' 2>/dev/null || true
          pkill -f 'dcp start-apiserver' 2>/dev/null || true
          pkill -f 'dcp run-controllers' 2>/dev/null || true
          pkill -f '/Aspire.Dashboard$' 2>/dev/null || true
          docker ps -aq | xargs -r docker rm -f >/dev/null 2>&1 || true
          rm -rf "$RAW" wrapping.key private.pem overlay* v13* v20* patched-v11 patched-v13 2>/dev/null || true

      - name: Upload sanitized live diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aspire-v24-live-dashboard-startup-diagnostics
          path: diagnostic-safe
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
