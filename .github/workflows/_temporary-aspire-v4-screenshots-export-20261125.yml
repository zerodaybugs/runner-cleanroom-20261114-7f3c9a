name: Export sealed Aspire v4 screenshots safely
on:
  push:
    branches: [main]
    paths: ['.github/workflows/_temporary-aspire-v4-screenshots-export-20261125.yml']
permissions:
  contents: read
  actions: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WRAPPING_KEY_B64: ${{ secrets.PAYLOAD_KEY_B64 }}
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' https://api.github.com/repos/zerodaybugs/runner-cleanroom-20261114-7f3c9a/actions/artifacts/15039747856/zip -o a.zip
          mkdir a e out && unzip -q a.zip -d a
          printf '%s' "$WRAPPING_KEY_B64" | openssl base64 -d -A > w.key
          W="$(od -An -tx1 -v w.key | tr -d ' \n')"
          openssl enc -d -aes-256-cbc -K "$W" -iv "$(tr -d '\r\n ' < bootstrap/private.iv.hex)" -in bootstrap/private.pem.enc -out private.pem
          tr -d '\r\n ' < sealed/aspire-macos-matrix-v2.key.enc.b64 | openssl base64 -d -A > k.enc
          openssl pkeyutl -decrypt -inkey private.pem -in k.enc -out k -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256
          K="$(od -An -tx1 -v k | tr -d ' \n')"
          openssl enc -d -aes-256-cbc -K "$K" -iv "$(tr -d '\r\n ' < a/evidence.iv.hex)" -in a/evidence.enc -out e.zip
          test "$(sha256sum e.zip | awk '{print $1}')" = "$(tr -d '\r\n ' < a/evidence.plain.sha256)"
          unzip -q e.zip -d e
          R="$(find e -mindepth 1 -maxdepth 1 -type d | head -1)"
          for lane in first_patched_13_6_5_legacy current_17_0_0_legacy current_17_0_0_legacy_natural_fix; do
            cp "$R/$lane/01-dashboard-authenticated.png" "out/$lane.png"
          done
          sha256sum out/*.png > out/SHA256SUMS.txt
          rm -rf a e a.zip e.zip w.key private.pem k.enc k
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aspire-v4-safe-screenshots-${{ github.sha }}
          path: out
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
