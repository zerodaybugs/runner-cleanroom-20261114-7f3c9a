name: Sealed PathString StaticFiles final PoC matrix 20261125

on:
  push:
    branches: [main]
    paths:
      - 'triggers/pathstring-staticfiles-final-v1-20261125.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            lane: net10
            sdk: 10.0.404
            runtime: 10.0.15
          - os: windows-2025
            lane: net10
            sdk: 10.0.404
            runtime: 10.0.15
          - os: windows-2022
            lane: net11
            sdk: 11.0.100
            runtime: 11.0.0
          - os: windows-2025
            lane: net11
            sdk: 11.0.100
            runtime: 11.0.0
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35

    steps:
      - name: Checkout sealed clean-room inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install exact SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: ${{ matrix.sdk }}
          cache: false

      - name: Unwrap and execute private final PoC
        id: execute
        continue-on-error: true
        shell: pwsh
        env:
          WRAPPING_KEY_B64: ${{ secrets.PAYLOAD_KEY_B64 }}
          DOTNET_NOLOGO: '1'
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_MULTILEVEL_LOOKUP: '0'
          DOTNET_ROLL_FORWARD: LatestPatch
          DOTNET_ROLL_FORWARD_TO_PRERELEASE: '0'
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:WRAPPING_KEY_B64)) { throw 'wrapping key missing' }

          $wrappingKey = [Convert]::FromBase64String($env:WRAPPING_KEY_B64)
          if ($wrappingKey.Length -ne 32) { throw 'wrapping key length invalid' }
          $wrappedPrivate = [IO.File]::ReadAllBytes((Join-Path $PWD 'bootstrap/private.pem.enc'))
          $wrapIv = [Convert]::FromHexString((Get-Content -LiteralPath (Join-Path $PWD 'bootstrap/private.iv.hex') -Raw).Trim())
          $aes = [Security.Cryptography.Aes]::Create()
          try {
            $aes.Mode = [Security.Cryptography.CipherMode]::CBC
            $aes.Padding = [Security.Cryptography.PaddingMode]::PKCS7
            $aes.Key = $wrappingKey
            $aes.IV = $wrapIv
            $dec = $aes.CreateDecryptor()
            try { $privatePemBytes = $dec.TransformFinalBlock($wrappedPrivate, 0, $wrappedPrivate.Length) }
            finally { $dec.Dispose() }
          } finally { $aes.Dispose() }

          $rsa = [Security.Cryptography.RSA]::Create()
          try {
            $rsa.ImportFromPem([Text.Encoding]::ASCII.GetString($privatePemBytes))
            $wrappedPayloadKey = [Convert]::FromBase64String((Get-Content -LiteralPath (Join-Path $PWD 'sealed/pathstring-staticfiles-final-v1/payload.key.enc.b64') -Raw).Trim())
            $payloadKey = $rsa.Decrypt($wrappedPayloadKey, [Security.Cryptography.RSAEncryptionPadding]::OaepSHA256)
          } finally { $rsa.Dispose() }
          if ($payloadKey.Length -ne 32) { throw 'payload key length invalid' }
          [IO.File]::WriteAllBytes((Join-Path $PWD 'pathstring-final.runtime.key'), $payloadKey)

          $wrappedHash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($wrappedPayloadKey)).ToLowerInvariant()
          if ($wrappedHash -ne '0ee77d2ac41cde19c4bd1e88d1db3715033c2915f713da0966501c08aa5275f0') { throw "wrapped key hash mismatch: $wrappedHash" }

          $cipherB64 = ((Get-ChildItem -LiteralPath (Join-Path $PWD 'sealed/pathstring-staticfiles-final-v1') -File -Filter 'payload.enc.part-*' | Sort-Object Name | ForEach-Object { (Get-Content -LiteralPath $_.FullName -Raw).Trim() }) -join '')
          $cipher = [Convert]::FromBase64String($cipherB64)
          $cipherHash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($cipher)).ToLowerInvariant()
          if ($cipherHash -ne 'd80a3e4d70cf5fcdf27735bf09c1b3f5e81c5ac425bbdbb4f2e4e12837157d70') { throw "cipher hash mismatch: $cipherHash" }

          $aes = [Security.Cryptography.Aes]::Create()
          try {
            $aes.Mode = [Security.Cryptography.CipherMode]::CBC
            $aes.Padding = [Security.Cryptography.PaddingMode]::PKCS7
            $aes.Key = $payloadKey
            $aes.IV = [Convert]::FromHexString('0deda0dfcc77b0605ced55b4399aa508')
            $dec = $aes.CreateDecryptor()
            try { $plain = $dec.TransformFinalBlock($cipher, 0, $cipher.Length) }
            finally { $dec.Dispose() }
          } finally { $aes.Dispose() }

          $plainHash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($plain)).ToLowerInvariant()
          if ($plainHash -ne '48b762eb2adc5ce896eeb32596203e8055577e8f39260cbd3e79d0fddb2866ac') { throw "payload hash mismatch: $plainHash" }
          $payloadZip = Join-Path $PWD 'pathstring-final.payload.zip'
          [IO.File]::WriteAllBytes($payloadZip, $plain)
          $payloadDir = Join-Path $PWD 'pathstring-final-payload'
          Expand-Archive -LiteralPath $payloadZip -DestinationPath $payloadDir -Force
          $root = Join-Path $payloadDir 'zdb-pathstring-staticfiles-final-v1'
          $evidence = Join-Path $PWD ("evidence-pathstring-final-{0}-{1}" -f '${{ matrix.lane }}','${{ matrix.os }}')
          & pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $root 'run.ps1') -Lane '${{ matrix.lane }}' -EvidenceDir $evidence
          if ($LASTEXITCODE -ne 0) { throw "final PoC failed: $LASTEXITCODE" }

      - name: Seal final evidence
        if: always()
        shell: pwsh
        env:
          EXECUTE_OUTCOME: ${{ steps.execute.outcome }}
        run: |
          $ErrorActionPreference = 'Stop'
          $keyPath = Join-Path $PWD 'pathstring-final.runtime.key'
          if (-not (Test-Path -LiteralPath $keyPath)) { throw 'evidence key unavailable' }
          $evidence = Join-Path $PWD ("evidence-pathstring-final-{0}-{1}" -f '${{ matrix.lane }}','${{ matrix.os }}')
          if (-not (Test-Path -LiteralPath $evidence)) {
            New-Item -ItemType Directory -Force -Path $evidence | Out-Null
            'NO_EVIDENCE_DIRECTORY' | Set-Content -LiteralPath (Join-Path $evidence 'status.txt') -Encoding ascii
          }
          @(
            'EXECUTE_OUTCOME=' + $env:EXECUTE_OUTCOME,
            'LANE=${{ matrix.lane }}',
            'SDK=${{ matrix.sdk }}',
            'RUNTIME=${{ matrix.runtime }}',
            'RUNNER=${{ matrix.os }}',
            'RUN_ID=${{ github.run_id }}',
            'SOURCE_SHA=${{ github.sha }}'
          ) | Set-Content -LiteralPath (Join-Path $evidence 'workflow-receipt.txt') -Encoding ascii

          $plainZip = Join-Path $PWD 'evidence.plain.zip'
          Compress-Archive -Path (Join-Path $evidence '*') -DestinationPath $plainZip -CompressionLevel Optimal -Force
          $plain = [IO.File]::ReadAllBytes($plainZip)
          $key = [IO.File]::ReadAllBytes($keyPath)
          $iv = [Security.Cryptography.RandomNumberGenerator]::GetBytes(16)
          $aes = [Security.Cryptography.Aes]::Create()
          try {
            $aes.Mode = [Security.Cryptography.CipherMode]::CBC
            $aes.Padding = [Security.Cryptography.PaddingMode]::PKCS7
            $aes.Key = $key
            $aes.IV = $iv
            $enc = $aes.CreateEncryptor()
            try { $sealedBytes = $enc.TransformFinalBlock($plain, 0, $plain.Length) }
            finally { $enc.Dispose() }
          } finally { $aes.Dispose() }

          $out = Join-Path $PWD 'sealed-final-evidence'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          [IO.File]::WriteAllBytes((Join-Path $out 'evidence.enc'), $sealedBytes)
          [Convert]::ToHexString($iv).ToLowerInvariant() | Set-Content -LiteralPath (Join-Path $out 'evidence.iv.hex') -Encoding ascii
          [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($plain)).ToLowerInvariant() | Set-Content -LiteralPath (Join-Path $out 'evidence.plain.sha256') -Encoding ascii
          [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($sealedBytes)).ToLowerInvariant() | Set-Content -LiteralPath (Join-Path $out 'evidence.cipher.sha256') -Encoding ascii
          Get-Content -LiteralPath (Join-Path $evidence 'workflow-receipt.txt') | Set-Content -LiteralPath (Join-Path $out 'metadata.txt') -Encoding ascii

          Remove-Item -LiteralPath $plainZip,$keyPath,(Join-Path $PWD 'pathstring-final.payload.zip') -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $PWD 'pathstring-final-payload'),$evidence -Recurse -Force -ErrorAction SilentlyContinue
          [Array]::Clear($key,0,$key.Length)

      - name: Upload sealed final evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pathstring-staticfiles-final-${{ matrix.lane }}-${{ matrix.os }}-${{ github.sha }}
          path: sealed-final-evidence
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Enforce final result
        if: always()
        shell: pwsh
        run: |
          if ('${{ steps.execute.outcome }}' -ne 'success') {
            throw 'The final private PoC did not satisfy every exact-GA control.'
          }
