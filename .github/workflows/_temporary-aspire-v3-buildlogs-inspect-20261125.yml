name: Inspect sealed Aspire v3 build logs safely

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_temporary-aspire-v3-buildlogs-inspect-20261125.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  inspect-builds:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Decrypt evidence and print compiler diagnostics only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WRAPPING_KEY_B64: ${{ secrets.PAYLOAD_KEY_B64 }}
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/zerodaybugs/runner-cleanroom-20261114-7f3c9a/actions/artifacts/15011655775/zip -o artifact.zip
          mkdir artifact evidence
          unzip -q artifact.zip -d artifact
          printf '%s' "$WRAPPING_KEY_B64" | openssl base64 -d -A > wrapping.key
          WRAP_KEY_HEX="$(od -An -tx1 -v wrapping.key | tr -d ' \n')"
          openssl enc -d -aes-256-cbc -K "$WRAP_KEY_HEX" -iv "$(tr -d '\r\n ' < bootstrap/private.iv.hex)" -in bootstrap/private.pem.enc -out private.pem
          tr -d '\r\n ' < sealed/aspire-macos-matrix-v2.key.enc.b64 | openssl base64 -d -A > payload.key.enc
          openssl pkeyutl -decrypt -inkey private.pem -in payload.key.enc -out runtime.key \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256
          KEY_HEX="$(od -An -tx1 -v runtime.key | tr -d ' \n')"
          openssl enc -d -aes-256-cbc -K "$KEY_HEX" -iv "$(tr -d '\r\n ' < artifact/evidence.iv.hex)" \
            -in artifact/evidence.enc -out evidence.zip
          test "$(sha256sum evidence.zip | awk '{print $1}')" = "$(tr -d '\r\n ' < artifact/evidence.plain.sha256)"
          unzip -q evidence.zip -d evidence
          ROOT="$(find evidence -mindepth 1 -maxdepth 1 -type d | head -1)"
          echo '=== LANE BUILD DIAGNOSTICS ==='
          find "$ROOT" -mindepth 2 -maxdepth 2 -type f -name build.log -print0 | sort -z | while IFS= read -r -d '' f; do
            echo "--- ${f#$ROOT/}"
            grep -E 'error (CS|MSB|NU|NETSDK)|: error|Build FAILED|ASPIRE[A-Z0-9]+' "$f" | tail -120 || tail -80 "$f"
          done
          echo '=== FIX BUILD DIAGNOSTICS ==='
          f="$ROOT/natural_fix_control/fix-build.log"
          if [[ -f "$f" ]]; then grep -E 'error (CS|MSB|NU|NETSDK)|: error|Build FAILED|ASPIRE[A-Z0-9]+' "$f" | tail -160 || tail -100 "$f"; fi
          rm -rf artifact evidence artifact.zip evidence.zip wrapping.key private.pem payload.key.enc runtime.key
