name: Sealed Aspire CVE-2026-120006 macOS residual matrix v2

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/_temporary-aspire-cve120006-macos-safe-diag-20261124.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-macos-matrix:
    runs-on: macos-15
    timeout-minutes: 110

    steps:
      - name: Checkout sealed clean-room inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install exact .NET SDK lanes
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: |
            10.0.404
            11.0.100
          cache: false

      - name: Install software-virtualized container runtime
        shell: bash
        run: |
          set -euo pipefail
          brew install docker qemu colima
          colima start --vm-type qemu --arch aarch64 --cpu 3 --memory 6 --disk 30 --runtime docker
          colima status
          docker version

      - name: Unwrap and execute private first-patched/current matrix
        id: execute
        continue-on-error: true
        shell: bash
        env:
          WRAPPING_KEY_B64: ${{ secrets.PAYLOAD_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "$WRAPPING_KEY_B64"

          printf '%s' "$WRAPPING_KEY_B64" | openssl base64 -d -A > wrapping.key
          test "$(wc -c < wrapping.key | tr -d ' ')" = "32"
          WRAP_KEY_HEX="$(od -An -tx1 -v wrapping.key | tr -d ' \n')"
          openssl enc -d -aes-256-cbc -K "$WRAP_KEY_HEX" -iv "$(tr -d '\r\n ' < bootstrap/private.iv.hex)" -in bootstrap/private.pem.enc -out private.pem

          tr -d '\r\n ' < sealed/aspire-macos-matrix-v2.key.enc.b64 | openssl base64 -d -A > payload.key.enc
          test "$(shasum -a 256 payload.key.enc | awk '{print $1}')" = "be22571a034deff9daca1291cecadcdddfd98e79f49ee4e4cd548eb5bff2b2ad"
          openssl pkeyutl -decrypt -inkey private.pem -in payload.key.enc -out matrix.runtime.key -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256
          test "$(wc -c < matrix.runtime.key | tr -d ' ')" = "32"

          tr -d '\r\n ' < sealed/aspire-macos-matrix-v2.enc.b64 | openssl base64 -d -A > payload.enc
          test "$(shasum -a 256 payload.enc | awk '{print $1}')" = "1d981b7a24d7f1d15d75782c658e122a87bab89e512f6dfa775d5827d0545f24"
          KEY_HEX="$(od -An -tx1 -v matrix.runtime.key | tr -d ' \n')"
          openssl enc -d -aes-256-cbc -K "$KEY_HEX" -iv "206224599d55f53eba5616f78531addb" -in payload.enc -out payload.zip
          test "$(shasum -a 256 payload.zip | awk '{print $1}')" = "ba640f7ae180b198351ff27f579158fabad7a7057261133bc5888dfe2e50a9f9"

          mkdir -p private-payload
          ditto -x -k payload.zip private-payload
          chmod +x private-payload/aspire-macos-matrix-v2/run.sh

          set +e
          private-payload/aspire-macos-matrix-v2/run.sh
          MATRIX_RC=$?
          set -e
          echo "matrix_rc=$MATRIX_RC" >> "$GITHUB_OUTPUT"
          exit "$MATRIX_RC"

      - name: Emit metadata-only build output diagnostics
        if: always()
        shell: bash
        run: |
          set -u
          echo '=== DOTNET VERSION ==='
          dotnet --info | sed -n '1,80p' || true
          echo '=== ASPIRE.HOSTING BUILD OUTPUTS ==='
          find zdb-matrix-work -type f \
            \( -name 'Aspire.Hosting.dll' -o -name 'Aspire.Hosting.deps.json' -o -name 'Aspire.Hosting.runtimeconfig.json' \) \
            -print 2>/dev/null | sort || true
          echo '=== RELEASE/TFM DIRECTORIES ==='
          find zdb-matrix-work/aspire-v17-source -maxdepth 9 -type d \
            \( -name Release -o -name net10.0 -o -name net11.0 -o -name artifacts -o -name bin \) \
            -print 2>/dev/null | sort | head -400 || true
          echo '=== SOURCE ROOT SUMMARY ==='
          du -sh zdb-matrix-work/aspire-v17-source 2>/dev/null || true
          find zdb-matrix-work/aspire-v17-source -maxdepth 3 -type d -print 2>/dev/null | sort | head -300 || true

      - name: Seal matrix evidence
        if: always()
        shell: bash
        env:
          EXECUTE_OUTCOME: ${{ steps.execute.outcome }}
        run: |
          set -euo pipefail
          test -f matrix.runtime.key
          EVIDENCE_DIR=evidence-aspire120006-macos-v2
          if [[ ! -d "$EVIDENCE_DIR" ]]; then
            mkdir -p "$EVIDENCE_DIR"
            printf 'NO_EVIDENCE_DIRECTORY\n' > "$EVIDENCE_DIR/status.txt"
          fi
          printf 'EXECUTE_OUTCOME=%s\nMATRIX_RC=%s\n' "$EXECUTE_OUTCOME" "${{ steps.execute.outputs.matrix_rc }}" > "$EVIDENCE_DIR/workflow-status.txt"

          ditto -c -k --sequesterRsrc --keepParent "$EVIDENCE_DIR" evidence.plain.zip
          PLAIN_SHA="$(shasum -a 256 evidence.plain.zip | awk '{print $1}')"
          EVIDENCE_IV="$(openssl rand -hex 16)"
          KEY_HEX="$(od -An -tx1 -v matrix.runtime.key | tr -d ' \n')"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$EVIDENCE_IV" -in evidence.plain.zip -out evidence.enc

          mkdir -p sealed-evidence
          mv evidence.enc sealed-evidence/evidence.enc
          printf '%s\n' "$EVIDENCE_IV" > sealed-evidence/evidence.iv.hex
          printf '%s\n' "$PLAIN_SHA" > sealed-evidence/evidence.plain.sha256
          shasum -a 256 sealed-evidence/evidence.enc | awk '{print $1}' > sealed-evidence/evidence.cipher.sha256
          cat > sealed-evidence/metadata.txt <<EOF
          FORMAT=ZDB-AES-256-CBC-PKCS7-V1
          TARGET=Aspire CVE-2026-120006 first-patched/current macOS residual matrix v2
          RUNNER=${{ runner.os }}-${{ runner.arch }}
          RUN_ID=${{ github.run_id }}
          SOURCE_SHA=${{ github.sha }}
          EXECUTE_OUTCOME=$EXECUTE_OUTCOME
          MATRIX_RC=${{ steps.execute.outputs.matrix_rc }}
          PAYLOAD_PLAIN_SHA256=ba640f7ae180b198351ff27f579158fabad7a7057261133bc5888dfe2e50a9f9
          PAYLOAD_CIPHER_SHA256=1d981b7a24d7f1d15d75782c658e122a87bab89e512f6dfa775d5827d0545f24
          EOF

          rm -rf evidence.plain.zip "$EVIDENCE_DIR" private-payload payload.zip payload.enc payload.key.enc private.pem wrapping.key matrix.runtime.key

      - name: Upload sealed matrix evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aspire-cve120006-macos-matrix-v2-${{ github.sha }}
          path: sealed-evidence
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Enforce matrix result
        if: always()
        shell: bash
        run: |
          if [[ '${{ steps.execute.outcome }}' != 'success' ]]; then
            echo 'Sealed Aspire matrix did not satisfy every expected lane; inspect encrypted evidence.'
            exit 1
          fi
