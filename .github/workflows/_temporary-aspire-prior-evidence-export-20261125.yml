name: Encrypted prior Aspire matrix evidence export

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_temporary-aspire-prior-evidence-export-20261125.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  export-prior-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout sealed inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Download and decrypt prior sealed evidence, then re-encrypt for local analysis
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WRAPPING_KEY_B64: ${{ secrets.PAYLOAD_KEY_B64 }}
          DIAG_PUBLIC_DER_B64: 
        run: |
          set -euo pipefail
          test -n "$WRAPPING_KEY_B64"

          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/zerodaybugs/runner-cleanroom-20261114-7f3c9a/actions/artifacts/14975039997/zip \
            -o prior-artifact.zip
          unzip -q prior-artifact.zip -d prior-artifact

          printf '%s' "$WRAPPING_KEY_B64" | openssl base64 -d -A > wrapping.key
          WRAP_KEY_HEX="$(od -An -tx1 -v wrapping.key | tr -d ' \n')"
          openssl enc -d -aes-256-cbc -K "$WRAP_KEY_HEX" -iv "$(tr -d '\r\n ' < bootstrap/private.iv.hex)" -in bootstrap/private.pem.enc -out private.pem
          tr -d '\r\n ' < sealed/aspire-macos-matrix-v2.key.enc.b64 | openssl base64 -d -A > payload.key.enc
          openssl pkeyutl -decrypt -inkey private.pem -in payload.key.enc -out matrix.runtime.key -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256
          MATRIX_KEY_HEX="$(od -An -tx1 -v matrix.runtime.key | tr -d ' \n')"
          EVIDENCE_IV="$(tr -d '\r\n ' < prior-artifact/evidence.iv.hex)"
          openssl enc -d -aes-256-cbc -K "$MATRIX_KEY_HEX" -iv "$EVIDENCE_IV" -in prior-artifact/evidence.enc -out prior-evidence.zip
          ACTUAL="$(sha256sum prior-evidence.zip | awk '{print $1}')"
          EXPECTED="$(tr -d '\r\n ' < prior-artifact/evidence.plain.sha256)"
          test "$ACTUAL" = "$EXPECTED"
          unzip -t prior-evidence.zip >/dev/null

          mkdir encrypted-diagnostic
          openssl rand 32 > diagnostic.key
          openssl rand 16 > diagnostic.iv
          DIAG_KEY_HEX="$(od -An -tx1 -v diagnostic.key | tr -d ' \n')"
          DIAG_IV_HEX="$(od -An -tx1 -v diagnostic.iv | tr -d ' \n')"
          openssl enc -aes-256-cbc -K "$DIAG_KEY_HEX" -iv "$DIAG_IV_HEX" -in prior-evidence.zip -out encrypted-diagnostic/prior-evidence.enc
          printf '%s' "$DIAG_PUBLIC_DER_B64" | openssl base64 -d -A > public.der
          openssl pkey -pubin -inform DER -in public.der -out public.pem
          openssl pkeyutl -encrypt -pubin -inkey public.pem -in diagnostic.key -out encrypted-diagnostic/key.enc -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256
          printf '%s\n' "$DIAG_IV_HEX" > encrypted-diagnostic/iv.hex
          printf '%s\n' "$ACTUAL" > encrypted-diagnostic/plain.sha256
          sha256sum encrypted-diagnostic/prior-evidence.enc | awk '{print $1}' > encrypted-diagnostic/cipher.sha256
          printf 'SOURCE_ARTIFACT_ID=14975039997\nFORMAT=RSA-OAEP-SHA256+A256CBC\n' > encrypted-diagnostic/metadata.txt
          rm -rf prior-artifact prior-artifact.zip prior-evidence.zip diagnostic.key diagnostic.iv payload.key.enc private.pem wrapping.key matrix.runtime.key public.der public.pem

      - name: Upload encrypted prior evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aspire-prior-evidence-${{ github.run_id }}
          path: encrypted-diagnostic
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
