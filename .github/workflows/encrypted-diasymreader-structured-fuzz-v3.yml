name: Encrypted DiaSymReader Structured Fuzz V3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: '10.0.404'
            tfm: 'net10.0'
            runtime: '10.0.15'
            repeat: 1
            pageheap: 'none'
            windows_max: 3000
            portable_max: 5000
          - sdk: '10.0.404'
            tfm: 'net10.0'
            runtime: '10.0.15'
            repeat: 2
            pageheap: 'full'
            windows_max: 1500
            portable_max: 2500
          - sdk: '11.0.100'
            tfm: 'net11.0'
            runtime: '11.0.0'
            repeat: 1
            pageheap: 'none'
            windows_max: 3000
            portable_max: 5000
          - sdk: '11.0.100'
            tfm: 'net11.0'
            runtime: '11.0.0'
            repeat: 2
            pageheap: 'full'
            windows_max: 1500
            portable_max: 2500
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.sdk }}

      - name: Unwrap and execute private structured fuzz payload
        shell: pwsh
        env:
          WRAPPING_KEY_B64: ${{ secrets.PAYLOAD_KEY_B64 }}
          SDK_VERSION: ${{ matrix.sdk }}
          TARGET_TFM: ${{ matrix.tfm }}
          RUNTIME_VERSION: ${{ matrix.runtime }}
          REPEAT_ID: ${{ matrix.repeat }}
          PAGEHEAP_MODE: ${{ matrix.pageheap }}
          WINDOWS_MAX_CASES: ${{ matrix.windows_max }}
          PORTABLE_MAX_CASES: ${{ matrix.portable_max }}
          EXPECTED_NATIVE_SHA256: ad3e85687b8d2d2eb09d1f097fdf7095372dbb044db5b64179f2d4b8024fed2b
          DOTNET_NOLOGO: '1'
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:WRAPPING_KEY_B64)) { throw 'wrapping key missing' }

          $wrappingKey = [Convert]::FromBase64String($env:WRAPPING_KEY_B64)
          if ($wrappingKey.Length -ne 32) { throw 'wrapping key length invalid' }
          $wrappedPrivate = [IO.File]::ReadAllBytes((Join-Path $PWD 'bootstrap/private.pem.enc'))
          $wrapIv = [Convert]::FromHexString((Get-Content -LiteralPath (Join-Path $PWD 'bootstrap/private.iv.hex') -Raw).Trim())

          $aes = [Security.Cryptography.Aes]::Create()
          try {
            $aes.Mode = [Security.Cryptography.CipherMode]::CBC
            $aes.Padding = [Security.Cryptography.PaddingMode]::PKCS7
            $aes.Key = $wrappingKey
            $aes.IV = $wrapIv
            $decryptor = $aes.CreateDecryptor()
            try {
              $privatePemBytes = $decryptor.TransformFinalBlock($wrappedPrivate, 0, $wrappedPrivate.Length)
            } finally { $decryptor.Dispose() }
          } finally { $aes.Dispose() }

          $rsa = [Security.Cryptography.RSA]::Create()
          try {
            $rsa.ImportFromPem([Text.Encoding]::ASCII.GetString($privatePemBytes))
            $wrappedPayloadKey = [Convert]::FromBase64String((Get-Content -LiteralPath (Join-Path $PWD 'dia-v3.key.enc.b64') -Raw).Trim())
            $payloadKey = $rsa.Decrypt($wrappedPayloadKey, [Security.Cryptography.RSAEncryptionPadding]::OaepSHA256)
          } finally { $rsa.Dispose() }
          if ($payloadKey.Length -ne 32) { throw 'payload key length invalid' }
          [IO.File]::WriteAllBytes((Join-Path $PWD 'dia-v3.runtime.key'), $payloadKey)

          $payloadIv = [Convert]::FromHexString((Get-Content -LiteralPath (Join-Path $PWD 'dia-v3.iv.hex') -Raw).Trim())
          $payloadCipherB64 = ((Get-ChildItem -LiteralPath $PWD -File -Filter 'dia-v3.enc.part*' | Sort-Object Name | ForEach-Object { (Get-Content -LiteralPath $_.FullName -Raw).Trim() }) -join '')
          if ([string]::IsNullOrWhiteSpace($payloadCipherB64)) { throw 'payload ciphertext parts missing' }
          $payloadCipher = [Convert]::FromBase64String($payloadCipherB64)
          $cipherHash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($payloadCipher)).ToLowerInvariant()
          $expectedCipherHash = (Get-Content -LiteralPath (Join-Path $PWD 'dia-v3.cipher.sha256') -Raw).Trim().ToLowerInvariant()
          if ($cipherHash -ne $expectedCipherHash) { throw "payload cipher hash mismatch: $cipherHash" }

          $aes = [Security.Cryptography.Aes]::Create()
          try {
            $aes.Mode = [Security.Cryptography.CipherMode]::CBC
            $aes.Padding = [Security.Cryptography.PaddingMode]::PKCS7
            $aes.Key = $payloadKey
            $aes.IV = $payloadIv
            $decryptor = $aes.CreateDecryptor()
            try {
              $payloadPlain = $decryptor.TransformFinalBlock($payloadCipher, 0, $payloadCipher.Length)
            } finally { $decryptor.Dispose() }
          } finally { $aes.Dispose() }

          $payloadZip = Join-Path $PWD 'dia-v3.zip'
          [IO.File]::WriteAllBytes($payloadZip, $payloadPlain)
          $expectedHash = (Get-Content -LiteralPath (Join-Path $PWD 'dia-v3.plain.sha256') -Raw).Trim().ToLowerInvariant()
          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $payloadZip).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) { throw "payload hash mismatch: $actualHash" }

          $payloadDir = Join-Path $PWD 'dia-v3-payload'
          Expand-Archive -LiteralPath $payloadZip -DestinationPath $payloadDir -Force
          & pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $payloadDir 'run.ps1')
          if ($LASTEXITCODE -ne 0) { throw "payload failed: $LASTEXITCODE" }

      - name: Seal structured fuzz evidence
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $keyPath = Join-Path $PWD 'dia-v3.runtime.key'
          $dirs = @(Get-ChildItem -LiteralPath $PWD -Directory -Filter 'evidence-diasymreader-v3-*')
          if ($dirs.Count -eq 0) {
            $fallback = Join-Path $PWD 'evidence-diasymreader-v3-fallback'
            New-Item -ItemType Directory -Force -Path $fallback | Out-Null
            'NO_EVIDENCE_DIRECTORY' | Set-Content (Join-Path $fallback 'status.txt')
            $dirs = @((Get-Item -LiteralPath $fallback))
          }
          if (-not (Test-Path -LiteralPath $keyPath)) { throw 'payload evidence key unavailable' }

          $zipPath = Join-Path $PWD 'evidence-v3.plain.zip'
          Compress-Archive -Path $dirs.FullName -DestinationPath $zipPath -Force
          $plainHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zipPath).Hash.ToLowerInvariant()
          $payloadKey = [IO.File]::ReadAllBytes($keyPath)
          $evidenceIv = [Security.Cryptography.RandomNumberGenerator]::GetBytes(16)
          $plain = [IO.File]::ReadAllBytes($zipPath)

          $aes = [Security.Cryptography.Aes]::Create()
          try {
            $aes.Mode = [Security.Cryptography.CipherMode]::CBC
            $aes.Padding = [Security.Cryptography.PaddingMode]::PKCS7
            $aes.Key = $payloadKey
            $aes.IV = $evidenceIv
            $encryptor = $aes.CreateEncryptor()
            try {
              $cipher = $encryptor.TransformFinalBlock($plain, 0, $plain.Length)
            } finally { $encryptor.Dispose() }
          } finally { $aes.Dispose() }

          $sealed = Join-Path $PWD 'sealed-evidence-v3'
          New-Item -ItemType Directory -Force -Path $sealed | Out-Null
          $cipherPath = Join-Path $sealed 'evidence.enc'
          [IO.File]::WriteAllBytes($cipherPath, $cipher)
          [Convert]::ToHexString($evidenceIv).ToLowerInvariant() | Set-Content (Join-Path $sealed 'evidence.iv.hex') -Encoding ascii
          $plainHash | Set-Content (Join-Path $sealed 'evidence.plain.sha256') -Encoding ascii
          (Get-FileHash -Algorithm SHA256 -LiteralPath $cipherPath).Hash.ToLowerInvariant() | Set-Content (Join-Path $sealed 'evidence.cipher.sha256') -Encoding ascii
          @(
            'FORMAT=ZDB-AES-256-CBC-PKCS7-V1',
            'PAYLOAD=dia-v3',
            'SDK=${{ matrix.sdk }}',
            'TFM=${{ matrix.tfm }}',
            'RUNTIME=${{ matrix.runtime }}',
            'REPEAT=${{ matrix.repeat }}',
            'PAGEHEAP=${{ matrix.pageheap }}',
            'RUN_ID=${{ github.run_id }}',
            'JOB=${{ github.job }}',
            'SOURCE_SHA=${{ github.sha }}'
          ) | Set-Content (Join-Path $sealed 'metadata.txt') -Encoding ascii

          Remove-Item -LiteralPath $zipPath,$keyPath,(Join-Path $PWD 'dia-v3.zip') -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $PWD 'dia-v3-payload') -Recurse -Force -ErrorAction SilentlyContinue
          foreach ($dir in $dirs) { Remove-Item -LiteralPath $dir.FullName -Recurse -Force -ErrorAction SilentlyContinue }

      - name: Upload sealed structured fuzz evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diasymreader-v3-${{ matrix.runtime }}-r${{ matrix.repeat }}-${{ matrix.pageheap }}
          path: sealed-evidence-v3
          if-no-files-found: error
          retention-days: 3
