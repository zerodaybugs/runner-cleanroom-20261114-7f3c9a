name: Inspect sealed Aspire v9 evidence safely

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_temporary-aspire-v9-evidence-safe-inspect-20261125.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout sealed inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Decrypt and emit non-sensitive diagnostics
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WRAPPING_KEY_B64: ${{ secrets.PAYLOAD_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "$WRAPPING_KEY_B64"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/zerodaybugs/runner-cleanroom-20261114-7f3c9a/actions/artifacts/15070813512/zip \
            -o artifact.zip
          mkdir artifact evidence
          unzip -q artifact.zip -d artifact

          printf '%s' "$WRAPPING_KEY_B64" | openssl base64 -d -A > wrapping.key
          test "$(wc -c < wrapping.key | tr -d ' ')" = "32"
          WRAP_KEY_HEX="$(od -An -tx1 -v wrapping.key | tr -d ' \n')"
          openssl enc -d -aes-256-cbc -K "$WRAP_KEY_HEX" -iv "$(tr -d '\r\n ' < bootstrap/private.iv.hex)" \
            -in bootstrap/private.pem.enc -out private.pem
          tr -d '\r\n ' < sealed/aspire-macos-matrix-v2.key.enc.b64 | openssl base64 -d -A > payload.key.enc
          openssl pkeyutl -decrypt -inkey private.pem -in payload.key.enc -out runtime.key \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256
          test "$(wc -c < runtime.key | tr -d ' ')" = "32"

          test "$(sha256sum artifact/evidence.enc | awk '{print $1}')" = "$(tr -d '\r\n ' < artifact/evidence.cipher.sha256)"
          KEY_HEX="$(od -An -tx1 -v runtime.key | tr -d ' \n')"
          IV="$(tr -d '\r\n ' < artifact/evidence.iv.hex)"
          openssl enc -d -aes-256-cbc -K "$KEY_HEX" -iv "$IV" -in artifact/evidence.enc -out evidence.zip
          test "$(sha256sum evidence.zip | awk '{print $1}')" = "$(tr -d '\r\n ' < artifact/evidence.plain.sha256)"
          unzip -q evidence.zip -d evidence
          ROOT="$(find evidence -mindepth 1 -maxdepth 1 -type d | head -1)"
          test -n "$ROOT"

          echo '=== WORKFLOW STATUS ==='
          cat "$ROOT/workflow-status.txt" 2>/dev/null || true
          echo '=== BOOTSTRAP STATUS ==='
          cat "$ROOT/bootstrap-status.txt" 2>/dev/null || true
          echo '=== MATRIX SUMMARY ==='
          python3 - "$ROOT/matrix-summary.json" <<'PY'
          import json,sys
          p=sys.argv[1]
          try:
              rows=json.load(open(p))
          except Exception as e:
              print(type(e).__name__,e); raise SystemExit(0)
          for row in rows:
              b=row.get('browser-result.json') or {}
              d=row.get('dcp-scope-assertion.json') or {}
              print(json.dumps({
                  'lane':row.get('lane'),
                  'status':row.get('status'),
                  'assertion':row.get('assertion'),
                  'browser':{k:b.get(k) for k in ['linkedServiceOpened','cookieLeak','replayAuthenticated','commandExecuted','errorStage','errorClass','errorMessage','replayError','replayTitle','cookieHeaderBytes'] if k in b},
                  'dcp':{k:d.get(k) for k in ['expected','pass','error'] if k in d},
                  'dashboardServices':d.get('dashboardServices'),
              },sort_keys=True))
          PY
          echo '=== STATUS AND ASSERTIONS ==='
          find "$ROOT" -mindepth 2 -maxdepth 2 -type f \( -name status.txt -o -name assertion.txt -o -name dcp-scope-assertion.json \) -print0 | sort -z | while IFS= read -r -d '' f; do
            echo "--- ${f#$ROOT/}"
            sed -n '1,220p' "$f"
          done
          echo '=== BROWSER RESULTS ==='
          find "$ROOT" -mindepth 2 -maxdepth 2 -type f -name browser-result.json -print0 | sort -z | while IFS= read -r -d '' f; do
            echo "--- ${f#$ROOT/}"
            python3 - "$f" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1]))
          keep=['lane','aspireVersion','mode','linkedServiceOpened','cookieLeak','replayAuthenticated','commandExecuted','errorStage','errorClass','errorMessage','replayError','replayTitle','cookieHeaderBytes','dashboardLinks']
          print(json.dumps({k:j.get(k) for k in keep if k in j},indent=2,sort_keys=True))
          PY
          done
          echo '=== FIX CONTROL ==='
          for f in "$ROOT/natural_fix_control/status.txt" "$ROOT/natural_fix_control/fix-dll.sha256" "$ROOT/natural_fix_control/natural-fix.patch" "$ROOT/natural_fix_control/revert-status.txt"; do
            if [[ -f "$f" ]]; then echo "--- ${f#$ROOT/}"; sed -n '1,260p' "$f"; fi
          done
          echo '=== FAILURE TAILS ==='
          find "$ROOT" -mindepth 2 -maxdepth 2 -type f \( -name apphost-tail.txt -o -name browser.stderr \) -print0 | sort -z | while IFS= read -r -d '' f; do
            echo "--- ${f#$ROOT/}"
            tail -180 "$f"
          done
          echo '=== BOOTSTRAP TRACE TAIL ==='
          tail -260 "$ROOT/bootstrap-trace.log" 2>/dev/null || true

          rm -rf artifact evidence artifact.zip evidence.zip wrapping.key private.pem payload.key.enc runtime.key
