name: Inspect cancelled Aspire v20 evidence safely

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/_temporary-aspire-v20-partial-evidence-inspect-20261128.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout sealed inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Decrypt and emit bounded metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WRAPPING_KEY_B64: ${{ secrets.PAYLOAD_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "$WRAPPING_KEY_B64"

          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/zerodaybugs/runner-cleanroom-20261114-7f3c9a/actions/artifacts/15219924988/zip \
            -o artifact.zip
          mkdir artifact evidence
          unzip -q artifact.zip -d artifact

          printf '%s' "$WRAPPING_KEY_B64" | openssl base64 -d -A > wrapping.key
          test "$(wc -c < wrapping.key | tr -d ' ')" = 32
          WRAP_KEY_HEX="$(od -An -tx1 -v wrapping.key | tr -d ' \n')"
          openssl enc -d -aes-256-cbc \
            -K "$WRAP_KEY_HEX" \
            -iv "$(tr -d '\r\n ' < bootstrap/private.iv.hex)" \
            -in bootstrap/private.pem.enc \
            -out private.pem

          tr -d '\r\n ' < sealed/aspire-macos-matrix-v2.key.enc.b64 | \
            openssl base64 -d -A > runtime.key.enc
          openssl pkeyutl -decrypt \
            -inkey private.pem \
            -in runtime.key.enc \
            -out runtime.key \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256
          test "$(wc -c < runtime.key | tr -d ' ')" = 32

          test "$(sha256sum artifact/evidence.enc | awk '{print $1}')" = \
            "$(tr -d '\r\n ' < artifact/evidence.cipher.sha256)"
          KEY_HEX="$(od -An -tx1 -v runtime.key | tr -d ' \n')"
          IV_HEX="$(tr -d '\r\n ' < artifact/evidence.iv.hex)"
          openssl enc -d -aes-256-cbc \
            -K "$KEY_HEX" \
            -iv "$IV_HEX" \
            -in artifact/evidence.enc \
            -out evidence.zip
          test "$(sha256sum evidence.zip | awk '{print $1}')" = \
            "$(tr -d '\r\n ' < artifact/evidence.plain.sha256)"
          unzip -q evidence.zip -d evidence
          ROOT="$(find evidence -mindepth 1 -maxdepth 1 -type d | head -1)"
          test -n "$ROOT"

          echo '=== ARTIFACT METADATA ==='
          sed -n '1,200p' artifact/metadata.txt || true
          echo '=== EVIDENCE INVENTORY ==='
          find "$ROOT" -maxdepth 3 -type f -printf '%P\t%s\n' | sort
          echo '=== WORKFLOW / BOOTSTRAP STATUS ==='
          for f in "$ROOT/workflow-status.txt" "$ROOT/bootstrap-status.txt" "$ROOT/status.txt"; do
            if [[ -f "$f" ]]; then echo "--- ${f#$ROOT/}"; sed -n '1,120p' "$f"; fi
          done
          echo '=== LANE DECISION FILES ==='
          find "$ROOT" -mindepth 2 -maxdepth 3 -type f \( \
            -name status.txt -o \
            -name assertion.txt -o \
            -name readiness.txt -o \
            -name framework-lane.txt -o \
            -name post-browser-health.json -o \
            -name dcp-scope-assertion.json -o \
            -name browser-result.json \
          \) -print0 | sort -z | while IFS= read -r -d '' f; do
            echo "--- ${f#$ROOT/}"
            python3 - "$f" <<'PY_REDACT'
          import json,re,sys
          p=sys.argv[1]
          text=open(p,encoding='utf-8',errors='replace').read()
          text=re.sub(r'(?i)(cookie|authorization|token|secret|password)(["\s:=]+)[^\s",}]+',r'\1\2<redacted>',text)
          try:
              obj=json.loads(text)
              def clean(v):
                  if isinstance(v,dict):
                      return {k:('<redacted>' if re.search(r'cookie|authorization|token|secret|password',k,re.I) else clean(x)) for k,x in v.items()}
                  if isinstance(v,list): return [clean(x) for x in v]
                  return v
              print(json.dumps(clean(obj),indent=2,sort_keys=True)[:20000])
          except Exception:
              print(text[:12000])
          PY_REDACT
          done
          echo '=== BOUNDED ERROR TAILS ==='
          find "$ROOT" -mindepth 2 -maxdepth 3 -type f \( \
            -name apphost-tail.txt -o \
            -name apphost.log -o \
            -name browser.stderr -o \
            -name browser.stdout -o \
            -name build.log -o \
            -name '*.log' \
          \) -print0 | sort -z | while IFS= read -r -d '' f; do
            echo "--- ${f#$ROOT/}"
            grep -Ei 'error|exception|failed|timeout|cancel|not ready|unhandled|killed|refused|certificate|yarp|dashboard|apphost' "$f" | tail -120 | \
              sed -E 's/([Cc]ookie|[Tt]oken|[Ss]ecret|[Pp]assword|[Aa]uthorization)[=: ]+[^ ]+/\1=<redacted>/g' || true
          done

          rm -rf artifact evidence artifact.zip evidence.zip wrapping.key private.pem runtime.key.enc runtime.key
          echo SAFE_V20_PARTIAL_INSPECTION=PASS
