name: Encrypted Aspire CVE-2026-120006 macOS debug matrix 20261124

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/_temporary-aspire-cve120006-macos-debug-encrypted-20261124.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-macos-debug:
    runs-on: macos-15
    timeout-minutes: 110

    steps:
      - name: Checkout encrypted clean-room inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install exact .NET SDK lanes
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: |
            10.0.404
            11.0.100
          cache: false

      - name: Install software-virtualized container runtime
        shell: bash
        run: |
          set -euo pipefail
          brew install docker qemu colima
          colima start --vm-type qemu --arch aarch64 --cpu 2 --memory 4 --disk 20 --runtime docker
          colima status
          docker version

      - name: Unwrap and execute private Aspire matrix with sealed trace
        id: execute
        continue-on-error: true
        shell: bash
        env:
          WRAPPING_KEY_B64: ${{ secrets.PAYLOAD_KEY_B64 }}
          DOTNET_NOLOGO: '1'
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_MULTILEVEL_LOOKUP: '0'
        run: |
          set -euo pipefail
          test -n "$WRAPPING_KEY_B64"
          mkdir -p evidence-aspire120006-macos

          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/_temporary-aspire-cve120006-macos-encrypted-20261124.yml').read_text()
          def extract(start, end, output):
              part = source.split(start, 1)[1].split(end, 1)[0]
              Path(output).write_text(textwrap.dedent(part).strip() + '\n')
          extract("cat > payload.key.enc.b64 <<'EOF_KEY'", 'EOF_KEY', 'payload.key.enc.b64')
          extract("cat > payload.cipher.b64 <<'EOF_CIPHER'", 'EOF_CIPHER', 'payload.cipher.b64')
          PY

          printf '%s' "$WRAPPING_KEY_B64" | openssl base64 -d -A > wrapping.key
          test "$(wc -c < wrapping.key | tr -d ' ')" = "32"
          WRAP_KEY_HEX="$(xxd -p -c 256 wrapping.key)"
          openssl enc -d -aes-256-cbc -K "$WRAP_KEY_HEX" -iv "$(tr -d '\r\n ' < bootstrap/private.iv.hex)" -in bootstrap/private.pem.enc -out private.pem

          openssl base64 -d -A -in payload.key.enc.b64 -out payload.key.enc
          openssl pkeyutl -decrypt -inkey private.pem -in payload.key.enc -out aspire120006.runtime.key -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256
          test "$(wc -c < aspire120006.runtime.key | tr -d ' ')" = "32"

          openssl base64 -d -A -in payload.cipher.b64 -out payload.cipher
          test "$(shasum -a 256 payload.cipher | awk '{print $1}')" = "f8fbf8ab46da85de8e2b6f74bb0541402fcc54fb85d559155f195eb80e0b8cf1"
          KEY_HEX="$(xxd -p -c 256 aspire120006.runtime.key)"
          openssl enc -d -aes-256-cbc -K "$KEY_HEX" -iv "39697e23f79ac921a0c4b30b90123c68" -in payload.cipher -out aspire120006.payload.zip
          test "$(shasum -a 256 aspire120006.payload.zip | awk '{print $1}')" = "d75d38fffb514f4b9ed338014540d17cb8fb8ddf7576472a8d28c536e0fcb870"

          mkdir -p private-payload
          ditto -x -k aspire120006.payload.zip private-payload
          chmod +x private-payload/zdb-aspire-macos/run.sh

          set +e
          bash -x private-payload/zdb-aspire-macos/run.sh > evidence-aspire120006-macos/bootstrap-trace.log 2>&1
          MATRIX_RC=$?
          set -e
          printf 'MATRIX_RC=%s\n' "$MATRIX_RC" > evidence-aspire120006-macos/bootstrap-status.txt
          exit "$MATRIX_RC"

      - name: Seal Aspire debug evidence
        if: always()
        shell: bash
        env:
          EXECUTE_OUTCOME: ${{ steps.execute.outcome }}
        run: |
          set -euo pipefail
          test -f aspire120006.runtime.key
          mkdir -p evidence-aspire120006-macos
          if [[ ! -f evidence-aspire120006-macos/bootstrap-status.txt ]]; then
            printf 'BOOTSTRAP_STATUS_MISSING\n' > evidence-aspire120006-macos/bootstrap-status.txt
          fi

          ditto -c -k --sequesterRsrc --keepParent evidence-aspire120006-macos evidence.plain.zip
          PLAIN_SHA="$(shasum -a 256 evidence.plain.zip | awk '{print $1}')"
          EVIDENCE_IV="$(openssl rand -hex 16)"
          KEY_HEX="$(xxd -p -c 256 aspire120006.runtime.key)"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$EVIDENCE_IV" -in evidence.plain.zip -out evidence.enc

          mkdir -p sealed-evidence
          mv evidence.enc sealed-evidence/evidence.enc
          printf '%s\n' "$EVIDENCE_IV" > sealed-evidence/evidence.iv.hex
          printf '%s\n' "$PLAIN_SHA" > sealed-evidence/evidence.plain.sha256
          shasum -a 256 sealed-evidence/evidence.enc | awk '{print $1}' > sealed-evidence/evidence.cipher.sha256
          cat > sealed-evidence/metadata.txt <<EOF
          FORMAT=ZDB-AES-256-CBC-PKCS7-V1
          TARGET=Aspire CVE-2026-120006 macOS debug residual matrix
          RUNNER=${{ runner.os }}-${{ runner.arch }}
          RUN_ID=${{ github.run_id }}
          SOURCE_SHA=${{ github.sha }}
          EXECUTE_OUTCOME=$EXECUTE_OUTCOME
          PAYLOAD_PLAIN_SHA256=d75d38fffb514f4b9ed338014540d17cb8fb8ddf7576472a8d28c536e0fcb870
          PAYLOAD_CIPHER_SHA256=f8fbf8ab46da85de8e2b6f74bb0541402fcc54fb85d559155f195eb80e0b8cf1
          EOF

          rm -rf evidence.plain.zip evidence-aspire120006-macos private-payload aspire120006.payload.zip payload.cipher payload.cipher.b64 payload.key.enc payload.key.enc.b64 private.pem wrapping.key aspire120006.runtime.key

      - name: Upload sealed Aspire debug evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aspire-cve120006-macos-debug-${{ github.sha }}
          path: sealed-evidence
          if-no-files-found: error
          retention-days: 3

      - name: Enforce matrix result
        if: always()
        shell: bash
        run: |
          if [[ '${{ steps.execute.outcome }}' != 'success' ]]; then
            echo 'Encrypted Aspire matrix failed; inspect sealed debug evidence.'
            exit 1
          fi
