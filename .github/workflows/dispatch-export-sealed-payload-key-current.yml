name: Dispatch Export Sealed Payload Key Current

on:
  push:
    paths:
      - 'triggers/export-sealed-payload-key-current-20261118.txt'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'export-sealed-payload-key.yml',
              ref: context.ref.replace('refs/heads/', '')
            });
