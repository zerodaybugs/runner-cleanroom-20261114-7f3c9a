name: Aspire v17 macOS build-path diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_temporary-aspire-v17-macos-buildpath-diag-20261125.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locate-build-output:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Install exact current .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.404
          cache: false

      - name: Clone exact Aspire release
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --depth 1 --branch v17.0.0 https://github.com/microsoft/aspire.git aspire-v17
          cd aspire-v17
          ACTUAL_SHA="$(git rev-parse HEAD)"
          printf 'ASPIRE_V17_TAG_SHA=%s\n' "$ACTUAL_SHA"
          test "$ACTUAL_SHA" = "2d325b13709752ba6d9a943635c5e2940a2530c0"

      - name: Build exact project and locate output
        shell: bash
        run: |
          set -euo pipefail
          cd aspire-v17
          dotnet --info
          dotnet build src/Aspire.Hosting/Aspire.Hosting.csproj -c Release --nologo
          find . -type f -name Aspire.Hosting.dll -path '*/Release/*' | sort > /tmp/aspire-hosting-dlls.txt
          FOUND_COUNT="$(grep -c . /tmp/aspire-hosting-dlls.txt || true)"
          printf 'FOUND_COUNT=%s\n' "$FOUND_COUNT"
          cat /tmp/aspire-hosting-dlls.txt
          test "$FOUND_COUNT" -ge 1
          while IFS= read -r dll; do
            shasum -a 256 "$dll"
            file "$dll"
          done < /tmp/aspire-hosting-dlls.txt
